<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tư vấn nhanh — Banca Sales Portal</title><script src="../../shared/js/head-loader.js?v=43"></script></head><body><script>
const p = BANCA.persona(), me = BANCA.current(), r = rel();
const qs = new URLSearchParams(location.search);
const fTab = qs.get('tab') || 'ALL';
const fSearch = (qs.get('q')||'').toLowerCase();

if(p.status!=='ACTIVE'){
  shell('Tư vấn nhanh','Không có quyền truy cập',`<div class="card"><div class="alert2 danger">Tài khoản ngừng hoạt động — không thể sử dụng Tư vấn nhanh.</div></div>`,{startSale:false});
} else {

// merge seed sessions + phiên tạo live (localStorage) của chính nhân viên tư vấn
function liveAdvice(){
  const out=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k && k.indexOf('banca_advice_')===0){
      try{ const s=JSON.parse(localStorage.getItem(k)); if(s && s.createdBy===me) out.push(s); }catch(e){}
    }
  }
  return out;
}
const seedAdvice = BANCA.myAdvice();
const live = liveAdvice();
const byId={};
seedAdvice.forEach(a=>byId[a.id]=a);
live.forEach(a=>{ byId[a.id]=Object.assign({}, byId[a.id]||{}, a); }); // live ghi đè seed cùng id
const all = Object.values(byId).sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));
const groupOf = s => (BANCA.ADVICE_STATUS[s]||{}).group || 'CLOSED';

// Tabs theo trạng thái
const tabs = [
  ['ALL','Tất cả', a=>true],
  ['ACTIVE','Đang thực hiện', a=>groupOf(a.status)==='ACTIVE'],
  ['SAVED','Đã lưu', a=>groupOf(a.status)==='SAVED'],
  ['FOLLOW_UP','Cần theo dõi', a=>groupOf(a.status)==='FOLLOW_UP'],
  ['CONVERTED','Đã chuyển bán', a=>groupOf(a.status)==='CONVERTED']
];
const activeTabDef = tabs.find(t=>t[0]===fTab) || tabs[0];
let rows = all.filter(activeTabDef[2]);
if(fSearch) rows = rows.filter(a=>(a.id+' '+(a.customerName||'')+' '+BANCA.needLabel(a.primaryNeed)).toLowerCase().includes(fSearch));

const count = def => all.filter(def[2]).length;
const tabBar = `<div class="tabbar" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">${tabs.map(t=>{
  const active = t[0]===fTab;
  const c = count(t);
  return `<a href="?tab=${t[0]}" class="tab" style="text-decoration:none;padding:8px 14px;border-radius:8px;font-size:13px;${active?'background:var(--brand-600);color:#fff;font-weight:600;':'background:var(--paper-card);color:var(--ink-500);border:1px solid var(--line);'}">${t[1]} <span style="opacity:.8;">${c}</span></a>`;
}).join('')}</div>`;

// Hành động theo trạng thái (theo ý định, không dùng "Xem" chung chung)
function adviceActions(a){
  const wsUrl = `${r}modules/advisory-workspace/index.html?id=${a.id}`;
  const s = a.status;
  if(groupOf(s)==='ACTIVE'){
    const canDelete = s==='IN_PROGRESS' && !a.selectedOffer;
    return `<a class="btn btn-primary btn-sm" href="${wsUrl}">Tiếp tục tư vấn</a>${canDelete?` <button class="btn btn-secondary btn-sm" style="color:var(--red-600);" onclick="advDeleteDraft('${a.id}')">Xoá nháp</button>`:''}`;
  }
  if(s==='SAVED'){
    return `<a class="btn btn-secondary btn-sm" href="${wsUrl}&step=result">Xem bản tư vấn</a> ${a.selectedOffer?`<a class="btn btn-primary btn-sm" href="${wsUrl}&step=result&convert=1">Tạo yêu cầu bảo hiểm từ tư vấn này</a>`:''}`;
  }
  if(s==='FOLLOW_UP_LATER'){
    return `<a class="btn btn-secondary btn-sm" href="${wsUrl}">Tiếp tục tư vấn</a> ${a.selectedOffer?`<a class="btn btn-primary btn-sm" href="${wsUrl}&step=result&convert=1">Tạo yêu cầu bảo hiểm từ tư vấn này</a>`:''}`;
  }
  if(s==='CONVERTED_TO_SALE'){
    return `<a class="btn btn-secondary btn-sm" href="${wsUrl}&step=result">Xem bản tư vấn</a> ${a.convertedCaseId?`<a class="btn btn-primary btn-sm" href="${r}modules/application-workspace/index.html?id=${a.convertedCaseId}">Mở yêu cầu</a>`:''}`;
  }
  return `<a class="btn btn-secondary btn-sm" href="${wsUrl}&step=result">Xem bản tư vấn</a>`;
}

const dash = v => (v==null||v===''||v==='null')?'—':v;
const MODE_LABEL = {ANONYMOUS:'Ẩn danh', BANK_CUSTOMER:'KH ngân hàng', NEW_PROSPECT:'Prospect', REFERRAL:'Referral', INSURANCE_CUSTOMER:'KH bảo hiểm'};
const personaName = pid => (BANCA.personas&&BANCA.personas[pid]?BANCA.personas[pid].name:pid)||'—';

const rowHtml = rows.map(a=>{
  const offer = a.selectedOffer;
  const anon = a.mode==='ANONYMOUS';
  const cust = anon ? '<span class="chip" style="background:#eef0f4;color:var(--ink-500);">Ẩn danh</span>' : dash(a.customerName||a.customerRef);
  const needTxt = (a.primaryNeed && BANCA.needLabel(a.primaryNeed)) ? BANCA.needLabel(a.primaryNeed) : 'Chưa xác định';
  return `<tr>
    <td><a href="${r}modules/advisory-workspace/index.html?id=${a.id}" style="font-weight:600;color:var(--brand-600);">${a.id}</a>${a.version>1?` <span class="badge badge-version">v${a.version}</span>`:''}</td>
    <td>${cust}</td>
    <td><span class="chip" style="background:${anon?'#eef0f4':'var(--brand-100)'};color:${anon?'var(--ink-500)':'var(--brand-700)'};">${MODE_LABEL[a.mode]||'—'}</span></td>
    <td style="font-size:13px;">${needTxt}</td>
    <td style="font-size:13px;">${offer?dash(offer.productName)+' · '+dash(offer.packageName):'<span style="color:var(--ink-300);">Chưa chọn</span>'}</td>
    <td style="font-size:13px;">${offer&&offer.premiumBand?offer.premiumBand+' <span class="help-hint" tabindex="0" title="Ph\u00ed minh h\u1ecda (indicative), ch\u01b0a ph\u1ea3i b\u00e1o gi\u00e1 cam k\u1ebft.">?</span>':'—'}</td>
    <td>${BANCA.adviceStatusBadge(a.status)}</td>
    <td style="font-size:12.5px;">${personaName(a.createdBy)}</td>
    <td>${a.convertedCaseId?`<a href="${r}modules/application-workspace/index.html?id=${a.convertedCaseId}" class="chip" style="text-decoration:none;background:var(--teal-100);color:var(--teal-600);">${a.convertedCaseId}</a>`:'<span style="color:var(--ink-300);">—</span>'}</td>
    <td style="font-size:12.5px;color:var(--ink-500);">${dash(a.updatedAt)}</td>
    <td style="white-space:nowrap;">${adviceActions(a)}</td>
  </tr>`;
}).join('');

const listBody = rows.length
  ? `<div class="card" style="padding:0;overflow-x:auto;"><table class="dtable adv-table"><thead><tr><th>Mã tư vấn</th><th>Khách hàng</th><th>Nguồn</th><th>Nhu cầu</th><th>Gói quan tâm</th><th>Phí minh họa</th><th>Trạng thái</th><th>Tư vấn viên</th><th>Yêu cầu</th><th>Cập nhật</th><th style="text-align:right;">Thao tác</th></tr></thead><tbody>${rowHtml}</tbody></table></div>`
  : `<div class="card"><div class="empty-state" style="padding:28px;">Chưa có phiên tư vấn nào ở nhóm này. Bấm <b>💡 Tư vấn nhanh</b> ở góc trên để bắt đầu một phiên mới — không tạo yêu cầu hay báo giá.</div></div>`;

// Toolbar gọn — nút bắt đầu tư vấn đã có ở thanh CTA phía trên (💡 Tư vấn nhanh), không lặp ở đây.
const toolbar = `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
    <input id="adv-search" value="${(qs.get('q')||'').replace(/"/g,'&quot;')}" placeholder="🔍 Tìm mã / khách / nhu cầu…" onkeydown="if(event.key==='Enter')advSearch()" style="padding:7px 11px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;width:220px;">
    <span style="font-size:12.5px;color:var(--ink-500);">Hiển thị <b>${rows.length}</b> / ${all.length} phiên</span>
  </div>
</div>`;

window.advSearch=function(){ const v=(document.getElementById('adv-search').value||'').trim(); const u=new URL(location.href); if(v)u.searchParams.set('q',v); else u.searchParams.delete('q'); location.href=u.toString(); };
window.advDeleteDraft=function(id){ if(confirm('Xoá phiên nháp '+id+'? (chỉ xoá nháp chưa có phương án)')){ try{ localStorage.removeItem('banca_advice_'+id); }catch(e){} const i=(BANCA.adviceSessions||[]).findIndex(a=>a.id===id); if(i>=0)BANCA.adviceSessions.splice(i,1); location.reload(); } };

shell('Tư vấn nhanh','Tư vấn nhanh', toolbar + tabBar + listBody, {startSale:false});
}
</script></body></html>
