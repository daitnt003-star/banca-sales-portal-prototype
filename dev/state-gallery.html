<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Banca Sales Portal Sprint 1</title><script src="../shared/js/head-loader.js?v=12"></script></head><body><script>shell('State Gallery','Demo Control · Loading / Empty / Error / Access States',`<div class="card" style="margin-bottom:16px;border-left:4px solid var(--brand-600);"><h2>Channel demo (§4.1)</h2><p style="font-size:13px;color:var(--ink-500);">Chuyển mô hình vận hành ngay trong công cụ thử nghiệm — reload để áp dụng toàn portal.</p>${BANCA.ui.channelSwitcher()}<div class="alert info" style="margin-top:10px;">Đang chạy: <b>${BANCA.channelProfile().label}</b> · List KH: <b>${BANCA.channelShowsCustomerList()?'Có':'Không'}</b> · Entry mặc định: <b>${BANCA.channelProfile().defaultEntryMode}</b> · Data access khởi tạo: <b>${BANCA.channelProfile().initialDataAccessStage}</b></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">${BANCA.CHANNEL_ENUM.map(id=>`<button class="btn btn-sm ${id===BANCA.channel()?'btn-primary':'btn-secondary'}" onclick="BANCA.setChannel('${id}')">${BANCA.CHANNEL_PROFILES[id].short}</button>`).join('')}</div></div><div class="grid cols-3"><div class="card"><h2>Loading</h2><div class="alert info">Đang tải readiness service...</div></div><div class="card"><h2>Empty</h2><div class="alert info">Không có sản phẩm được phép bán trong scope hiện tại.</div></div><div class="card"><h2>Partial error</h2><div class="alert warn">LMS timeout — readiness chuyển PENDING, CTA bị khóa.</div></div><div class="card"><h2>Access denied</h2><div class="alert danger">Bạn không có quyền truy cập sản phẩm/case này.</div></div><div class="card"><h2>Session expired</h2><div class="alert warn">Phiên đăng nhập hết hạn. Vui lòng đăng nhập lại.</div></div><div class="card"><h2>Badges</h2>${badge('READY')} ${badge('CONDITIONAL')} ${badge('BLOCKED')} ${badge('SERVICE_UNVERIFIED')}</div></div>`)</script></body></html>
