<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hợp đồng — Banca Sales Portal</title><script src="../../shared/js/head-loader.js?v=42"></script></head><body><script>
const p = BANCA.persona(), me = BANCA.current(), r = rel();
const qs = new URLSearchParams(location.search);
const view = qs.get('view') || 'list';
const fTab = qs.get('f') || 'ALL';
const TODAY = '2026-07-20';

if(p.status!=='ACTIVE'){
 shell('Hợp đồng','Không có quyền truy cập',`<div class="card"><div class="alert2 danger">Tài khoản ngừng hoạt động.</div></div>`,{startSale:false});

 // ===================== POLICY DETAIL (A-05: view qua query param) =====================
 const pol = BANCA.policyById(qs.get('id'));
 const canView = pol && (pol.owner===me
  || (BANCA.inManagerScope && BANCA.inManagerScope(BANCA.personas[pol.owner], me))
  || (p.managerScope==='TEAM' && (BANCA.personas[pol.owner]||{}).team===p.team)
  || (p.managerScope==='BRANCH' && (BANCA.personas[pol.owner]||{}).branch===p.branch));
 if(!pol){
  shell('Hợp đồng','Không tìm thấy',`<div class="card"><div class="empty-state">Hợp đồng không tồn tại. <a href="index.html">Về danh sách</a></div></div>`,{startSale:false});
 } else if(!canView){
  shell('Hợp đồng','ACCESS_DENIED',`<div class="card"><div class="alert2 danger"><b>ACCESS_DENIED</b> — persona ${me} không có quyền xem hợp đồng ${pol.id} (owner ${pol.owner}).</div></div>`,{startSale:false});
 } else {
  // ===== Policy Detail v2 (doc 17:04 — PHẦN A A1-A9 + PHẦN B action groups) =====
  const cust = BANCA.customerById(pol.customerId)||{};
  const row=(k,v)=>`<tr><td style="width:250px;min-width:250px;color:var(--ink-500);font-size:12.5px;">${k}</td><td style="font-size:13px;">${v}</td></tr>`;
  const srcApp = pol.appId? BANCA.appById(pol.appId) : null;
  const q = srcApp&&srcApp.quote;
  const commission = (BANCA.commissionVisible&&BANCA.commissionVisible('policy')) ? BANCA.commissionOfPolicy(pol) : null;
  const v = pol.vehicle||{};
  const pkgCode=(pol.package||'').toUpperCase();
  const pkg=BANCA.motorPackages[pkgCode]||{};
  const addOns=pol.addOns||pkg.defaultAddOns||[];
  const activeStatus = pol.status==='ACTIVE';
  const inRenewalWindow = pol.renewalStatus==='RENEWAL_DUE';
  // A5 quyền lợi kèm SỐ TIỀN
  const benefitRows=[
   ['TNDS bắt buộc — người','150.000.000 ₫/người/vụ'],
   ['TNDS bắt buộc — tài sản','100.000.000 ₫/vụ'],
   ['Vật chất xe (IDV)', pol.idv?`<b>${BANCA.vnd(pol.idv)}</b> — mức trần bồi thường${pkgCode==='PREMIUM'?' · thay mới không khấu hao':''}`:'Theo giá trị xe'],
   ['Mức khấu trừ', pol.deductible?`<b>${BANCA.vnd(pol.deductible)}</b>/vụ (phần khách tự chịu)`:'Theo gói'],
   ...(pol.ntx?[['Người ngồi trên xe (NTX)',`${BANCA.vnd(pol.ntx.perSeat)}/người × ${pol.ntx.seats} chỗ`]]:[]),
   ...addOns.map(c=>{const a=BANCA.motorAddOns[c]||{};return ['Mở rộng: '+(a.name||c),'Có — theo điều khoản '+(pol.wordingRef||'')];}),
   ...(pkgCode==='PREMIUM'?[['Cứu hộ 24/7','Tối đa 4 lần/năm · 2.000.000 ₫/vụ']]:[]),
   ['Lựa chọn garage', pol.garage||'Thường'],
   ['Phạm vi lãnh thổ', pol.territory||'Việt Nam']
  ];

  const feeRows = q&&q.subtotal!=null? [
   ['TNDS bắt buộc',BANCA.vnd(q.tplPremium)],

   ...(q.lines||[]).map(l=>[(l.amount<0?'− ':'+ ')+l.label,BANCA.vnd(Math.abs(l.amount))]),

    ['Xuất / Xem hóa đơn VAT', {active:'menu',nearExpiry:'menu',expired:'menu',cancelled:'menu'}],
    ['Ghi chú nội bộ', {active:'menu',nearExpiry:'menu',expired:'menu',cancelled:'menu'}]
  ];

  // actionRules is internal only; visible matrix removed per UI feedback.


  // PHẦN B: action bar chuẩn hoá — action chính theo trạng thái, phần còn lại vào "Khác".
  const canRenew = statusBucket==='nearExpiry'||statusBucket==='expired';

  if(pol.status==='ACTIVE') moreItems.push(['Yêu cầu hủy','Chấm dứt hợp đồng trước hạn']);

  moreItems.push(['Ghi chú nội bộ','']);

  const docLinks = [
    ['GCN PDF', pol.certificate+'.pdf', 'file', 'Bản GCN hiện hành từ Core'],
    ['Policy wording', pol.wordingRef||'QT-BH-VCX-2025', 'file', 'Bộ quy tắc/điều khoản bảo hiểm'],
    ['Hồ sơ gốc', pol.appId||'—', 'page', 'Application nguồn'],
    ['Hóa đơn VAT', pol.vatInvoice||'Chưa phát hành', 'file', 'Hóa đơn điện tử'],
    ['Thư thẩm định', srcApp&&srcApp.uw&&srcApp.uw.letter||'—', 'file', 'Decision/UW letter']
  ];
  const docRows = docLinks.map(([name,link,type,desc])=>{const href= type==='page'&&link!=='—' ? `${r}modules/application-workspace/index.html?id=${link}` : '#'; const dl=type==='file'?' download':''; const click=type==='file'?` onclick="alert('Auto tải về file demo: ${link}')"`:''; return `<div style="display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line);"><div><a href="${href}"${dl}${click} style="color:var(--brand-600);font-weight:700;text-decoration:none;">${name}</a><div style="font-size:11px;color:var(--ink-300);margin-top:2px;">${link}</div></div><div style="font-size:12.5px;color:var(--ink-500);">${desc}</div></div>`}).join('');
  const benefitCards = benefitRows.map(([b,m])=>`<div style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;"><div style="font-size:12.5px;font-weight:700;color:var(--ink-800);">${b}</div><div style="font-size:12px;color:var(--ink-500);margin-top:4px;">${m}</div></div>`).join('');
  const historyTree = `<div class="card" style="padding:16px;">
    <div class="label" style="margin-bottom:10px;">Dòng thời gian hợp đồng</div>
    ${(pol.audit||[]).map(a2=>`<div style="display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;margin-bottom:12px;"><div style="width:16px;height:16px;border-radius:50%;background:var(--teal-600);color:white;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;margin-top:1px;">✓</div><div><div style="font-size:13px;font-weight:700;color:var(--ink-800);line-height:1.25;">${a2.action}</div><div style="font-size:12px;color:var(--ink-500);margin-top:2px;">${a2.at} · ${a2.by}</div></div></div>`).join('') || '<div style="font-size:12px;color:var(--ink-300);">—</div>'}
    <details style="margin-top:8px;"><summary style="cursor:pointer;color:var(--brand-600);font-size:12.5px;font-weight:700;">Xem endorsement & claim</summary>
      <div style="margin-top:10px;"><div class="label" style="margin-bottom:6px;">Endorsement</div>${(pol.endorsements||[]).length? pol.endorsements.map(e=>`<div style="font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line);"><b>${e.no}</b> · ${e.date} · ${e.type}: ${e.detail} · chênh phí ${e.feeDelta?BANCA.vnd(e.feeDelta):'0 ₫'}</div>`).join('') : '<div style="font-size:12px;color:var(--ink-300);">Chưa có sửa đổi bổ sung.</div>'}</div>
      <div style="margin-top:10px;"><div class="label" style="margin-bottom:6px;">Claim</div>${(pol.claims||[]).length? pol.claims.map(c2=>`<div style="font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line);"><b>${c2.no}</b> · ${c2.date} · ${c2.type} · ${BANCA.vnd(c2.amount)} · <span class="badge badge-ready">${c2.status}</span><div style="font-size:11px;color:var(--ink-300);">${c2.note||''}</div></div>`).join('') : '<div style="font-size:12px;color:var(--ink-300);">Chưa có bồi thường.</div>'}</div>
    </details>

  shell('Hợp đồng','Chi tiết hợp đồng '+pol.id,`
  <style>
   .policy-cockpit .pc-hero{background:linear-gradient(135deg,#ffffff 0%,#f7f9ff 100%);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 4px 16px rgba(10,25,60,.06);} 
   .policy-cockpit .pc-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start;} 
   .policy-cockpit .pc-main{display:grid;gap:16px;} 
   .policy-cockpit .pc-rail{position:sticky;top:68px;display:grid;gap:12px;} 
   .policy-cockpit .pc-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(10,25,60,.04);} 
   .policy-cockpit .pc-card h2{font-size:15px;margin:0 0 12px;color:var(--ink-900);} 
   .policy-cockpit .pc-kv{display:grid;grid-template-columns:250px 1fr;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px;} 
   .policy-cockpit .pc-kv:last-child{border-bottom:none;} 
   .policy-cockpit .pc-kv .k{color:var(--ink-500);} .policy-cockpit .pc-kv .v{color:var(--ink-800);font-weight:600;} 
   @media(max-width:1100px){.policy-cockpit .pc-grid{grid-template-columns:1fr}.policy-cockpit .pc-rail{position:static}.policy-cockpit .pc-kv{grid-template-columns:180px 1fr}}
  </style>
  <div class="policy-cockpit">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;position:sticky;top:0;z-index:31;background:var(--paper,#f7f9fc);padding:8px 0;">
      <a href="index.html" style="font-size:12.5px;color:var(--brand-600);">&larr; Danh sách hợp đồng</a>
      ${actionBar}
    </div>

    <section class="pc-hero">
      <div style="display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap;">

          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><h1 style="font-size:22px;margin:0;color:var(--ink-900);">${pol.id}</h1>${BANCA.policyBadge(pol.status)}${inRenewalWindow?' <span class="badge badge-conditional">Sắp tái tục</span>':''}</div>
          <div style="font-size:13px;color:var(--ink-500);margin-top:5px;">GCN ${pol.certificate} · ${pol.productName} · ${pol.package} · ${srcApp?'cấp mới':'—'}</div>
          <div style="font-size:12.5px;color:var(--ink-500);margin-top:10px;">${cust.name||'—'} · ${v.brand||''} ${v.model||''} ${v.year||''} · ${v.plate||'—'}</div>
        </div>
        ${pol.ncdTier?`<div style="text-align:right;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;"><div style="font-size:10.5px;color:var(--ink-300);">BẬC NCD</div><b style="font-size:20px;color:${pol.ncdTier.percent?'var(--teal-600)':'var(--ink-500)'};">${pol.ncdTier.percent}%</b><div style="font-size:10.5px;color:var(--ink-300);">${pol.ncdTier.yearsNoClaim} năm không claim</div></div>`:''}

      ${miniCard('Số tiền BH (IDV)',pol.idv?BANCA.vnd(pol.idv):'Theo giá trị xe','Mức trần bồi thường','var(--brand-600)')}
      ${miniCard('Mức khấu trừ',pol.deductible?BANCA.vnd(pol.deductible):'Theo gói','Khách tự chịu / vụ','var(--amber-600)')}

    </div>

        <section id="history" style="scroll-margin-top:90px;">${historyTree}</section>
      </main>
      <aside class="pc-rail">
        <section id="parties" class="pc-card" style="scroll-margin-top:90px;"><h2>Định danh & các bên</h2>${sideKv('Số hợp đồng / GCN',pol.id+' · '+pol.certificate)}${sideKv('Nguồn cấp',srcApp?`Cấp mới — <a href="${r}modules/application-workspace/index.html?id=${pol.appId}" style="color:var(--brand-600);">${pol.appId}</a>`:'—')}${sideKv('Bên mua bảo hiểm',`${cust.name||'—'}<br><span style="font-weight:400;color:var(--ink-500);">${cust.cif||'prospect'} · ${BANCA.maskPhone?BANCA.maskPhone(cust.phone):cust.phone||''}</span>`)}${sideKv('Người được BH','Chính chủ (= bên mua)')}${sideKv('Seller / kênh bán',`${(BANCA.personas[pol.owner]||{}).name||pol.owner}<br><span style="font-weight:400;color:var(--ink-500);">Banca · Janus Bank</span>`)}</section>
        ${(()=>{ const d=BANCA.policyDistributionOf?BANCA.policyDistributionOf(pol.id,pol.owner):null; if(!d)return ''; const nm=uid=>uid?`${BANCA.pName(uid)}<br><span style="font-weight:400;color:var(--ink-500);">${BANCA.pLine(uid)}</span>`:'—';
          return `<section id="distribution" class="pc-card" style="scroll-margin-top:90px;"><h2>Phân phối & người tham gia</h2>
          ${sideKv('Người giới thiệu', nm(d.referrer))}
          ${sideKv('Người tư vấn', nm(d.advisor))}
          ${sideKv('Người phục vụ hiện tại', nm(d.servicingSeller))}
          ${sideKv('Nguồn / Campaign', `${d.campaign||'—'}`)}
          ${sideKv('External reference', d.externalRef||'—')}
          ${sideKv('Ngày ghi nhận hiệu lực', d.effectiveDate||pol.effectiveFrom||'—')}
          ${d._fallback?'<div style="font-size:11px;color:var(--ink-300);">Chưa có snapshot phân phối — hiển thị theo người phụ trách.</div>':''}
          <div style="font-size:11px;color:var(--ink-300);margin-top:6px;">Người bán (ở mục Định danh & các bên) & người phục vụ là hai vai trò khác nhau; chuyển phục vụ không đổi người bán.</div></section>`; })()}
        <section id="vehicle" class="pc-card" style="scroll-margin-top:90px;"><h2>Xe & thời hạn</h2>${sideKv('Xe',`${v.brand||''} ${v.model||''} ${v.year||''}`)}${sideKv('Biển số / VIN',`${v.plate||'—'} · ${v.vin||'—'}`)}${sideKv('Số máy / số chỗ',`${v.engineNo||'—'} · ${v.seats||'—'} chỗ`)}${sideKv('Hiệu lực',pol.effectiveFrom+' → '+pol.effectiveTo)}${sideKv('Tình trạng thế chấp',mgP&&mgP.mortgaged?'Có — xe là tài sản bảo đảm':'Không')}</section>
        <section class="pc-card"><h2>Bên thụ hưởng / NTH</h2><div style="font-size:13px;color:${mgP&&mgP.mortgaged?'var(--amber-600)':'var(--ink-700)'};font-weight:700;">${mgP&&mgP.mortgaged?`${mgP.bank||'—'}${mgP.branch?' · '+mgP.branch:''}`:'Chủ xe (xe không thế chấp)'}</div>${mgP&&mgP.mortgaged?`<div style="font-size:11.5px;color:var(--ink-500);margin-top:4px;">HĐ tín dụng ${mgP.creditContract||'—'}</div>`:'<div style="font-size:11.5px;color:var(--ink-500);margin-top:4px;">Không kích hoạt điều khoản thụ hưởng.</div>'}</section>
        ${commission?`<section class="pc-card"><h2>Hoa hồng</h2>${sideKv('Hoa hồng dự kiến',`<b style="color:var(--teal-600);font-size:16px;">${BANCA.vnd(commission.amount)}</b>`)}${sideKv('Cơ sở tính HH',BANCA.vnd(commission.base))}${sideKv('Tỷ lệ',(commission.rate*100).toFixed(0)+'% · '+pol.package)}${sideKv('Trạng thái',`<span class="badge badge-ready">${commission.stateLabel}</span>`)}<div style="font-size:11px;color:var(--ink-300);margin-top:8px;">Read-only · sync ${commission.syncAt}</div></section>`:''}
        <section class="pc-card"><h2>Ghi chú vận hành</h2><div style="font-size:12px;color:var(--ink-500);line-height:1.5;">Sales Portal chỉ đọc policy master từ Core. Tái tục = đơn mới; endorsement = đổi nội dung cùng số đơn; hủy = chấm dứt trước hạn.</div></section>
      </aside>
    </div>
  </div>
  `,{startSale:false});
 }
} else {
 // ===================== LIST =====================
 // Phạm vi tổ chức: Của tôi / Đội nhóm / Chi nhánh / Khu vực (tương tự Hồ sơ).
 const SCOPES = (BANCA.availableScopes?BANCA.availableScopes(me):['SELF']);
 const fScope = SCOPES.includes(qs.get('scope'))?qs.get('scope'):'SELF';
 const isMgr = fScope!=='SELF';
 let all = (BANCA.policiesForScope ? BANCA.policiesForScope(fScope, me) : BANCA.myPolicies().filter(x=>x.owner===me));
 const daysTo = x => Math.ceil((new Date(x.effectiveTo+'T00:00:00')-new Date(TODAY+'T00:00:00'))/86400000);
 const matchTab = (x,tab) => {
  if(tab==='NEW') return x.isNew;
  if(tab==='ACTIVE') return x.status==='ACTIVE' && x.effectiveFrom<=TODAY && TODAY<=x.effectiveTo;
  if(tab==='RENEWAL') return x.renewalStatus==='RENEWAL_DUE';
  if(tab==='NEAR_EXPIRY') return x.status==='ACTIVE' && daysTo(x)>0 && daysTo(x)<=45;
  if(tab==='EXPIRED') return x.status!=='ACTIVE';
  return true;
 };
 // "Cần hành động" = sắp tái tục HOẶC sắp hết hiệu lực — việc kinh doanh cần làm ngay.
 const needsAction = x => matchTab(x,'RENEWAL') || matchTab(x,'NEAR_EXPIRY');
 // Search: khách hàng / số HĐ / số GCN / biển số
 const fQ=(qs.get('q')||'').toLowerCase();
 const fProd=qs.get('prod')||'ALL';
 const fSt=qs.get('st')||'ALL';
 let pols = all.filter(x=> fTab==='ACTION' ? needsAction(x) : matchTab(x,fTab));
 const fPart = qs.get('part')||'ALL';
 if(fPart!=='ALL') pols = pols.filter(x=>{const d=BANCA.policyDistributionOf?BANCA.policyDistributionOf(x.id,x.owner):{}; return [d.referrer,d.advisor,d.sellingProducer,d.servicingSeller].includes(fPart);});
 if(fProd!=='ALL') pols = pols.filter(x=>x.productId===fProd||x.productName===fProd);
 if(fSt!=='ALL') pols = pols.filter(x=>x.status===fSt);
 if(fQ) pols = pols.filter(x=>{ const c=BANCA.customerById(x.customerId)||{}; const plate=((x.vehicle||{}).plate||'').toLowerCase();
   return (c.name||'').toLowerCase().includes(fQ)||x.id.toLowerCase().includes(fQ)||(x.certificate||'').toLowerCase().includes(fQ)||plate.includes(fQ); });
 // ---- Quick filters (giữ) ----
 const tabs=[['ALL','Tất cả'],['ACTION','Cần hành động'],['RENEWAL','Sắp tái tục'],['NEAR_EXPIRY','Sắp hết hiệu lực'],['NEW','Mới phát hành'],['EXPIRED','Hết hiệu lực / hủy']];
 const keepP=(k,v)=>{const o=new URLSearchParams(location.search); if(v==null||v==='ALL'||v==='')o.delete(k);else o.set(k,v); return '?'+o.toString();};
 const quickFilters=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">${tabs.map(([id,l])=>{const n=id==='ACTION'?all.filter(needsAction).length:all.filter(x=>matchTab(x,id)).length; const danger=(id==='ACTION'||id==='NEAR_EXPIRY')&&n>0&&fTab!==id; return `<a href="${keepP('f',id==='ALL'?null:id)}" class="chip" style="cursor:pointer;text-decoration:none;padding:7px 14px;font-size:12.5px;font-weight:600;${fTab===id?'background:var(--brand-600);color:#fff;':danger?'background:#fff6e6;color:var(--amber-600);border:1px solid #ffe0a3;':'background:var(--paper-card);color:var(--ink-500);border:1px solid var(--line);'}">${l} (${n})</a>`;}).join('')}</div>`;
 // ---- Search + drawer (người tham gia / sản phẩm / trạng thái vào drawer) ----
 const products=[...new Set(all.map(x=>x.productName))];
 const statuses=[...new Set(all.map(x=>x.status))];
 const stLabel=st=>({ACTIVE:'Đang hiệu lực',EXPIRED:'Hết hiệu lực',CANCELLED:'Đã hủy'}[st]||st);
 const fd=filterDrawer([
   {name:'part',label:'Người tham gia',type:'select',value:fPart,options:[['ALL','Mọi người tham gia'],...Object.keys(BANCA.personas||{}).map(pid=>[pid,(BANCA.personas[pid]||{}).name||pid])]},
   {name:'prod',label:'Sản phẩm',type:'select',value:fProd,options:[['ALL','Mọi sản phẩm'],...products.map(p2=>[p2,p2])]},
   {name:'st',label:'Trạng thái',type:'select',value:fSt,options:[['ALL','Mọi trạng thái'],...statuses.map(st=>[st,stLabel(st)])]}
 ], {f:fTab!=='ALL'?fTab:'', scope:fScope!=='SELF'?fScope:'', q:qs.get('q')||''});
 const searchRow=`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;">
   <form method="get" style="display:flex;gap:8px;align-items:center;">
     ${fTab!=='ALL'?`<input type="hidden" name="f" value="${fTab}">`:''}
     ${fScope!=='SELF'?`<input type="hidden" name="scope" value="${fScope}">`:''}
     <input name="q" value="${qs.get('q')||''}" placeholder="🔍 Tìm khách hàng / số HĐ / số GCN / biển số" style="padding:8px 12px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;width:300px;">
   </form>
   ${fd.button}
 </div>`;
 const filterBar=searchRow+quickFilters+fd.tags+fd.drawer;
 // ---- Bảng gộp cột: Khách/HĐ | Người bán | Sản phẩm | Hiệu lực | Phí | Trạng thái | Hành động ----
 const bankBadge = `<span class="chip" style="background:var(--brand-100);color:var(--brand-700);font-size:10px;">Janus Bank</span>`;
 const rows=pols.map(x=>{
  const c=BANCA.customerById(x.customerId)||{};
  const dLeft=daysTo(x);
  const effTone = x.status!=='ACTIVE'?'var(--ink-300)':dLeft<=45?'var(--amber-600)':'var(--ink-500)';
  const effNote = x.status!=='ACTIVE'?stLabel(x.status):dLeft<=0?'Đã hết hạn':dLeft<=45?('Còn '+dLeft+' ngày'):('Còn '+dLeft+' ngày');
  return `<tr style="cursor:pointer;" onclick="location.href='?view=detail&id=${x.id}'">
  <td>${BANCA.customerCell(c)}<div style="font-size:11px;color:var(--ink-300);margin-top:2px;"><span style="font-weight:600;color:var(--brand-600);">${x.id}</span> · GCN ${x.certificate} ${bankBadge}</div>${isMgr&&x.owner!==me?`<div style="font-size:11px;color:var(--ink-300);">${(BANCA.personas[x.owner]||{}).name||x.owner}</div>`:''}</td>
  <td style="font-size:12px;">${(()=>{const d=BANCA.policyDistributionOf?BANCA.policyDistributionOf(x.id,x.owner):{}; return BANCA.sellerCell(d._fallback?null:d.referrer, d._fallback?null:d.advisor, d.sellingProducer||x.owner);})()}</td>
  <td style="font-size:12px;">${x.productName} · ${x.package}${(x.vehicle&&x.vehicle.plate)?`<div style="font-size:11px;color:var(--ink-300);">${x.vehicle.brand||''} ${x.vehicle.model||''} · ${x.vehicle.plate}</div>`:''}</td>
  <td style="font-size:11.5px;">${x.effectiveFrom} → ${x.effectiveTo}<div style="font-size:11px;color:${effTone};font-weight:600;">${effNote}</div></td>
  <td style="font-size:12px;">${BANCA.vnd(x.premium)}</td>
  <td>${BANCA.policyBadge(x.status)}${x.renewalStatus==='RENEWAL_DUE'?' <span class="badge badge-conditional">Sắp tái tục</span>':''}${x.isNew?' <span class="badge badge-ready">Mới</span>':''}</td>
  <td style="white-space:nowrap;" onclick="event.stopPropagation();">${policyActions(x)}</td>
 </tr>`;}).join('');
 // Action chuẩn hóa theo trạng thái: mỗi dòng 1 action CHÍNH + Chi tiết phụ.
 function policyActions(x){
   const detail=`<a class="btn btn-secondary btn-sm" href="?view=detail&id=${x.id}">Chi tiết</a>`;
   if(x.renewalStatus==='RENEWAL_DUE'){
     const renew = x.renewalDraftId?`<a class="btn btn-primary btn-sm" href="${r}modules/application-workspace/index.html?id=${x.renewalDraftId}">Tái tục</a>`:`<button class="btn btn-primary btn-sm" onclick="alert('Tạo hồ sơ tái tục (demo)')">Tái tục</button>`;
     return renew+' '+detail;
   }
   if(x.isNew) return `<button class="btn btn-primary btn-sm" onclick="alert('Gửi GCN cho khách (demo)')">Gửi GCN</button> `+detail;
   if(x.status!=='ACTIVE') return detail+` <button class="btn btn-secondary btn-sm" onclick="alert('Lý do hủy: ${(x.cancelReason||'Khách yêu cầu chấm dứt trước hạn').replace(/'/g,'')} (demo)')">Xem lý do hủy</button>`;
   // Đang hiệu lực
   return detail+` <button class="btn btn-secondary btn-sm" onclick="alert('Tạo yêu cầu bồi thường (demo)')">Tạo bồi thường</button>`;
 }
 const scopeLabelOf=s=>({SELF:'Của tôi',TEAM:'Đội nhóm',BRANCH:'Chi nhánh',REGION:'Khu vực'}[s]||s);
 const scopeKeep=s=>{const o=new URLSearchParams(location.search); if(s==='SELF')o.delete('scope');else o.set('scope',s); return '?'+o.toString();};
 const scopeBar = SCOPES.length>1 ? `<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">${SCOPES.map(s=>`<a href="${scopeKeep(s)}" class="tab" style="text-decoration:none;padding:6px 14px;border-radius:8px;font-size:12.5px;${fScope===s?'background:var(--brand-600);color:#fff;font-weight:600;':'background:var(--paper-card);color:var(--ink-500);border:1px solid var(--line);'}">${scopeLabelOf(s)}</a>`).join('')}</div>` : '';
 shell('Hợp đồng','Hợp đồng',
 scopeBar+`
 ${BANCA.uxListHeader('Danh sách hợp đồng','Theo dõi hợp đồng đã phát hành, tái tục và hiệu lực',`Hiển thị <b>${pols.length}</b> / ${all.length} hợp đồng · phạm vi <b>${scopeLabelOf(fScope)}</b>`,filterBar)}
 ${pols.length?`<div class="card" style="padding:0;"><table class="dtable"><thead><tr><th>Khách hàng / Hợp đồng</th><th>Người bán</th><th>Sản phẩm</th><th>Hiệu lực</th><th>Phí</th><th>Trạng thái</th><th>Hành động</th></tr></thead><tbody>${rows}</tbody></table></div>`
  :`<div class="card"><div class="empty-state">Không có hợp đồng khớp bộ lọc. <a href="?">Xóa bộ lọc</a></div></div>`}
 `);
}
</script></body></html>
