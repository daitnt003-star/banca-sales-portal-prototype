<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Advisory Workspace — Tư vấn nhanh</title><script src="../../shared/js/head-loader.js?v=44"></script>
<style>
  .adv-layout{display:grid;grid-template-columns:minmax(0,66fr) minmax(300px,34fr);gap:16px;align-items:start;}
  .adv-side{position:sticky;top:16px;display:grid;gap:12px;}
  .adv-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .adv-step{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12px;border:1px solid var(--line);background:var(--paper-card);color:var(--ink-500);}
  .adv-step .n{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:var(--line);}
  .adv-step.done{background:var(--teal-100);color:var(--teal-600);border-color:transparent;}
  .adv-step.done .n{background:var(--teal-600);color:#fff;}
  .adv-step.active{background:var(--brand-600);color:#fff;border-color:transparent;font-weight:600;}
  .adv-step.active .n{background:rgba(255,255,255,.25);}
  .need-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
  .need-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:border-color .14s,box-shadow .14s;background:var(--paper-card);}
  .need-card:hover{border-color:var(--brand-500);}
  .need-card.sel{border-color:var(--brand-600);box-shadow:0 0 0 2px var(--brand-100) inset;}
  .need-card .ic{font-size:20px;}
  .opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;}
  .opt-card{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--paper-card);}
  .opt-card.sel{border-color:var(--brand-600);box-shadow:0 0 0 2px var(--brand-100) inset;}
  .adv-footer{position:sticky;bottom:0;z-index:25;background:rgba(246,248,251,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 0;margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .cmp-table{width:100%;border-collapse:collapse;font-size:13px;}
  .cmp-table th,.cmp-table td{border-bottom:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top;}
  .cmp-table thead th{position:sticky;top:0;background:var(--paper-card);z-index:var(--z-sticky);}
  /* §B — thẻ phương án nhiều nhu cầu */
  .plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--space-md);}
  .plan-card{border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-lg);display:flex;flex-direction:column;gap:var(--space-sm);background:var(--paper-card);}
  .plan-card.sel{border-color:var(--brand-600);box-shadow:0 0 0 2px var(--brand-100) inset;}
  .plan-tag{font-size:var(--text-2xs);font-weight:700;letter-spacing:.04em;padding:var(--space-3xs) var(--space-sm);border-radius:var(--radius-xs);display:inline-block;}
  .plan-tag.budget{background:var(--teal-100);color:var(--teal-600);}
  .plan-tag.fuller{background:var(--brand-100);color:var(--brand-700);}
  /* §D — sticky comparison bar + drawer */
  .adv-cmp-bar{position:sticky;bottom:calc(var(--space-4xl) + var(--space-3xl));z-index:var(--z-sticky);display:flex;justify-content:space-between;align-items:center;gap:var(--space-md);flex-wrap:wrap;background:var(--ink-900);color:var(--paper-card);padding:var(--space-sm) var(--space-lg);border-radius:var(--radius-lg);box-shadow:var(--shadow-3);margin-top:var(--space-md);}
  .adv-cmp-bar-actions{display:flex;gap:var(--space-sm);align-items:center;}
  .adv-drawer-overlay{position:fixed;inset:0;background:rgba(14,21,37,.4);z-index:var(--z-drawer);}
  .adv-drawer{position:fixed;top:0;right:0;height:100%;width:min(calc(var(--sb2-w) * 2),94vw);background:var(--paper-card);z-index:var(--z-drawer);box-shadow:var(--shadow-3);display:flex;flex-direction:column;}
  .adv-drawer-head{display:flex;justify-content:space-between;align-items:center;gap:var(--space-md);padding:var(--space-lg);border-bottom:1px solid var(--line);}
  .adv-drawer-title{margin:0;font-size:var(--text-lg);}
  .adv-drawer-body{padding:var(--space-lg);overflow:auto;flex:1;}
  /* tiện ích giữ markup mới ngắn + đúng token */
  .adv-kv{display:flex;justify-content:space-between;gap:var(--space-sm);font-size:var(--text-xs);}
  .adv-kv.sm{font-size:var(--text-sm);}
  .adv-kv .k{color:var(--ink-500);}
  .adv-sub{font-size:var(--text-xs);color:var(--ink-500);}
  .adv-hint{font-size:var(--text-2xs);color:var(--ink-300);}
  .adv-chips{display:flex;gap:var(--space-xs);flex-wrap:wrap;margin-top:var(--space-xs);}
  .adv-grid-kv{display:grid;gap:var(--space-2xs);}
  .adv-th{display:flex;justify-content:space-between;align-items:center;gap:var(--space-xs);}
  .adv-x{border:none;background:none;cursor:pointer;color:var(--ink-300);line-height:1;}
  .badge-mini{font-size:var(--text-2xs);}
  @media(min-width:641px) and (max-width:1024px){.adv-drawer{width:min(calc(var(--sb2-w) * 2 + var(--sb1-w)),96vw);}}
  @media(max-width:640px){.adv-drawer{width:100vw;}.adv-cmp-bar{bottom:calc(var(--space-4xl) + var(--space-2xl));}}
  @media(max-width:1024px){.adv-layout{grid-template-columns:1fr;}.adv-side{position:static;}}
  @media(prefers-reduced-motion:no-preference){.adv-drawer{transition:transform var(--duration-slow);}}
</style></head><body><script>
const p = BANCA.persona(), me = BANCA.current(), r = rel();
const qs = new URLSearchParams(location.search);

if(p.status!=='ACTIVE'){
  shell('Tư vấn nhanh','Không có quyền truy cập',`<div class="card"><div class="alert2 danger">Tài khoản ngừng hoạt động.</div></div>`,{startSale:false});
} else {

// ---------- STATE (auto-save demo qua localStorage) ----------
// §D — 'compare' KHÔNG còn là bước bắt buộc; so sánh chuyển thành drawer tùy chọn.
const STEPS = [['needs','Nhu cầu','❤️'],['priority','Phân tích','📊'],['recommend','Gợi ý','⭐'],['result','Quyết định','🎯']];
const isNew = qs.get('new')==='1';
let id = qs.get('id');
function key(x){ return 'banca_advice_'+x; }
function load(x){ try{ return JSON.parse(localStorage.getItem(key(x))||'null'); }catch(e){ return null; } }
function persist(s){ localStorage.setItem(key(s.id), JSON.stringify(s)); }

let state;
if(isNew || !id){
  id = BANCA.newAdviceId();
  state = {id, version:1, mode:'ANONYMOUS', status:'IN_PROGRESS', customerRef:null, customerName:null,
           needProfile:[], primaryNeed:null, budgetBand:null, desiredTerm:'1 năm', priorities:{},
           compareSet:[], selectedOffer:null, upsell:[], createdBy:me, startedAt:Date.now(), updatedAt:BANCA.nowLabel?BANCA.nowLabel():'2026-07-21 12:00',
           // §6.2 — ngữ cảnh ngân hàng: nhận từ deep link (?ctx=) hoặc seller chọn ở bước Nhu cầu.
           bankingContext:null};
  const _ctx = qs.get('ctx');
  if(_ctx && BANCA.bankingContextById(_ctx)) applyBankingContext(state, _ctx, me);
  persist(state);
  history.replaceState(null,'',`?id=${id}`);
} else {
  state = load(id);
  if(!state){
    const seed = BANCA.adviceById(id);
    if(seed){ state = JSON.parse(JSON.stringify(seed)); state.needProfile=state.needProfile||[]; state.priorities=state.priorities||{}; state.compareSet=state.compareSet||[]; persist(state); }
  }
  if(!state){ shell('Tư vấn nhanh','Không tìm thấy',`<div class="card"><div class="empty-state">Không tìm thấy phiên tư vấn <b>${id}</b>. <a href="${r}modules/quick-advisory/index.html">Về danh sách</a></div></div>`,{startSale:false}); throw 0; }
}

let step = qs.get('step') || (state.primaryNeed?'recommend':'needs');
// §D — deep link cũ ?step=compare không còn bước riêng → đưa về Gợi ý (nơi có drawer so sánh).
if(!STEPS.some(s=>s[0]===step)) step = state.primaryNeed ? 'recommend' : 'needs';
// §D — compareSet chuẩn hóa về khoá gộp productRef:packageRef (data cũ chỉ có packageRef).
state.compareSet = (state.compareSet||[]).map(function(x){
  if(String(x).indexOf(':')>=0) return x;
  const pr = (BANCA.adviceOffersFor(state.primaryNeed)[0]||{}).productRef || 'health';
  return pr+':'+x;
});
let saveMsg = 'Đã lưu lúc '+state.updatedAt;
const locked = state.locked===true || ['NOT_INTERESTED','CONVERTED_TO_SALE'].includes(state.status);

// §6.2 — áp ngữ cảnh ngân hàng: set nhu cầu gợi ý + nhu cầu chính (đã lọc theo quyền bán).
// Dùng CHUNG cho deep link từ ngân hàng và cho seller chọn tay — không tách 2 nhánh.
function applyBankingContext(st, ctxId, who){
  const c = BANCA.bankingContextById(ctxId); if(!c) return;
  st.bankingContext = ctxId;
  const needs = BANCA.contextNeedsFor(ctxId, who);
  if(needs.length){
    st.needProfile = needs.map(n=>({needId:n, label:BANCA.needLabel(n), weight:'HIGH'}));
    st.primaryNeed = needs.indexOf(c.primaryNeed)>=0 ? c.primaryNeed : needs[0];
  }
}
// expose state mutators to window (onclick handlers)
function save(){ state.updatedAt = (new Date()).toTimeString().slice(0,5); persist(state); const el=document.getElementById('adv-save'); if(el){ el.textContent='Đang lưu…'; setTimeout(()=>{ el.textContent='Đã lưu lúc '+state.updatedAt; },250); } }
window.advGo = function(s){ const u=new URL(location.href); u.searchParams.set('step',s); u.searchParams.set('id',state.id); location.href=u.toString(); };
window.advToggleNeed = function(nid){ const i=state.needProfile.findIndex(n=>n.needId===nid); if(i>=0) state.needProfile.splice(i,1); else state.needProfile.push({needId:nid,label:BANCA.needLabel(nid),weight:'MEDIUM'}); if(!state.primaryNeed && state.needProfile[0]) state.primaryNeed=state.needProfile[0].needId; if(state.primaryNeed && !state.needProfile.some(n=>n.needId===state.primaryNeed)) state.primaryNeed=(state.needProfile[0]||{}).needId||null; save(); renderStep(); };
window.advSetContext = function(ctxId){
  if(state.bankingContext===ctxId){ state.bankingContext=null; }
  else { applyBankingContext(state, ctxId, me); }
  save(); renderStep();
};
window.advSetBudget = function(b){ state.budgetBand=b; save(); renderStep(); };
window.advSetMode = function(m){ state.mode=m; if(m==='ANONYMOUS'){state.customerRef=null;state.customerName=null;} save(); renderStep(); };
window.advSetPrimary = function(nid){ state.primaryNeed=nid; save(); renderStep(); };
window.advSetWeight = function(nid,w){ state.priorities[nid]=w; save(); renderStep(); };
// §D — compareSet dùng khoá gộp productRef:packageRef, tối đa 3; mở/đóng drawer KHÔNG đổi business status.
function advCmpRef(productRef,pkg){ return productRef+':'+pkg; }
window.advToggleCompareRef = function(ref){
  const i=state.compareSet.indexOf(ref);
  if(i>=0) state.compareSet.splice(i,1);
  else { if(state.compareSet.length>=3){ advToast('So sánh tối đa 3 phương án.'); return; } state.compareSet.push(ref); }
  save(); renderStep();
  if(document.querySelector('.adv-drawer[data-kind="compare"]')){ if(state.compareSet.length>=2) advOpenCompare(); else advDrawerClose(); }
};
// tương thích chữ ký cũ (offer card của nhu cầu chính): pkg thuộc sản phẩm nhu cầu chính
window.advToggleCompare = function(pkg){ const pr=(BANCA.adviceOffersFor(state.primaryNeed)[0]||{}).productRef||'health'; advToggleCompareRef(advCmpRef(pr,pkg)); };
window.advClearCompare = function(){ state.compareSet=[]; save(); renderStep(); advDrawerClose(); };
// Tìm offer theo khoá gộp productRef:packageRef trên toàn danh mục (dùng cho sản phẩm khác).
function advOfferByRef(ref){
  const parts=String(ref).split(':'); const pr=parts[0], pk=parts[1];
  const all=Object.keys(BANCA.ADVICE_OFFERS).reduce((a,k)=>a.concat(BANCA.ADVICE_OFFERS[k]),[]);
  return all.find(o=>o.productRef===pr && o.packageRef===pk) || null;
}
// Áp một offer đã chọn vào state (KHÔNG tự động thêm — chỉ khi seller bấm chọn).
function applySelectedOffer(o, planId){
  if(!o) return;
  state.selectedOffer={productRef:o.productRef, productName:o.productName, packageRef:o.packageRef, packageName:o.packageName, premiumBand:o.premiumBand, fit:o.fit, issueTime:o.issueTime};
  // §6.3 — lưu đúng bộ khoá spec để Quote Workspace KHÔNG bắt chọn lại sản phẩm/gói.
  state.selectedProductId      = o.productRef;
  state.selectedPackageId      = o.packageRef;
  state.recommendationVersion  = BANCA.RECOMMENDATION_VERSION;
  state.estimatedPremium       = o.premiumBand;
  state.adviceOutcome          = 'OFFER_SELECTED';
  if(planId===undefined) state.selectedPlan=null;   // chọn 1 sản phẩm lẻ → không còn gắn plan
}
window.advSelectOffer = function(pkg){
  const o=(BANCA.adviceOffersFor(state.primaryNeed)||[]).find(x=>x.packageRef===pkg);
  applySelectedOffer(o); save(); renderStep();
};
// §C — chọn một sản phẩm KHÁC (từ drawer "Xem sản phẩm khác") nếu đủ điều kiện bán.
window.advSelectOfferRef = function(ref){
  const o=advOfferByRef(ref); if(!o) return;
  const rd = BANCA.readinessFor ? BANCA.readinessFor(o.productRef) : {ready:true};
  if(!(rd.ready || rd.canQuote)){ advToast('Bạn chưa đủ điều kiện bán sản phẩm này.'); return; }
  applySelectedOffer(o); save(); advDrawerClose(); renderStep();
  advToast('Đã chọn '+o.productName+' · '+o.packageName+'.');
};
// §B — chọn một PHƯƠNG ÁN (plan). Lưu selectedPlan + selectedOffer (sản phẩm chính) để convert mang đúng lựa chọn.
window.advSelectPlan = function(planId){
  const rec=BANCA.recommendPlans(state); const plan=(rec.plans||[]).find(p=>p.id===planId);
  if(!plan || !plan.primaryOffer) return;
  applySelectedOffer(plan.primaryOffer, planId);
  state.selectedPlan={id:plan.id, label:plan.label, offers:plan.offers.map(o=>({productRef:o.productRef, packageRef:o.packageRef, packageName:o.packageName, productName:o.productName, premiumBand:o.premiumBand})), coveredNeeds:plan.coveredNeeds, remainingGaps:plan.remainingGaps, totalMonthly:plan.totalMonthly, recommendationVersion:BANCA.RECOMMENDATION_VERSION};
  save(); renderStep();
};
window.advSaveSession = function(){ state.status='SAVED'; save(); syncSeed(); advToast('Đã lưu bản tư vấn '+state.id+'. Không tạo yêu cầu hay báo giá.'); setTimeout(()=>{ location.href=r+'modules/quick-advisory/index.html?tab=SAVED'; },800); };
window.advFollowUp = function(){
  advModal(`<div style="font-size:14px;margin-bottom:8px;">Hẹn theo dõi lại phiên <b>${state.id}</b></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
     <button class="btn btn-secondary btn-sm" onclick="advDoFollowUp('Ngày mai','2026-07-23')">Ngày mai</button>
     <button class="btn btn-secondary btn-sm" onclick="advDoFollowUp('Tuần sau','2026-07-29')">Tuần sau</button>
     <button class="btn btn-secondary btn-sm" onclick="advDoFollowUp('Tuỳ chọn', (document.getElementById('fu-date')||{}).value)">Tuỳ chọn</button>
   </div>
   <input type="date" id="fu-date" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;">
   <div style="font-size:11px;color:var(--ink-300);margin-top:8px;">Sẽ tạo task nhắc RM liên hệ lại khách.</div>`);
};
window.advDoFollowUp = function(label, date){
  state.status='FOLLOW_UP_LATER'; state.followUpDate=date||'2026-07-25'; save(); syncSeed(); advModalClose();
  advToast('Đã tạo task theo dõi ('+label+' · '+(date||state.followUpDate)+').');
  setTimeout(()=>{ location.href=r+'modules/quick-advisory/index.html?tab=FOLLOW_UP'; },900);
};
window.advNotInterested = function(){ state.status='NOT_INTERESTED'; save(); syncSeed(); location.href=r+'modules/quick-advisory/index.html'; };
window.advNotInterestedConfirm = function(){
  advModal(`<div style="font-size:14px;margin-bottom:8px;">Ghi nhận khách <b>chưa quan tâm</b> phiên tư vấn <b>${state.id}</b>?</div>
   <div style="font-size:12px;color:var(--ink-500);margin-bottom:12px;">Phiên sẽ được đánh dấu "Chưa quan tâm" và <b>khoá chỉnh sửa</b>. Bạn vẫn xem lại được, và có thể mở phiên tư vấn mới nếu khách quay lại.</div>
   <div style="display:flex;gap:8px;justify-content:flex-end;"><button class="btn btn-secondary btn-sm" onclick="advModalClose()">Huỷ</button><button class="btn btn-primary btn-sm" style="background:var(--red-600);" onclick="advDoNotInterested()">Xác nhận</button></div>`);
};
window.advDoNotInterested = function(){ state.status='NOT_INTERESTED'; state.locked=true; save(); syncSeed(); advModalClose(); advToast('Đã ghi nhận chưa quan tâm — phiên đã khoá.'); setTimeout(()=>{ location.href=r+'modules/quick-advisory/index.html'; },800); };

// ---------- In-page modal + toast (bỏ native alert/confirm/prompt) ----------
function advModal(html){ const root=document.getElementById('start-sale-root'); root.innerHTML=`<div class="modal-overlay2 open" onclick="if(event.target===this)advModalClose()"><div class="modal2" style="max-width:520px;" onclick="event.stopPropagation()"><div class="modal2-head"><b>Tư vấn nhanh</b><span class="modal2-close" onclick="advModalClose()">&times;</span></div><div class="modal2-body">${html}</div></div></div>`; }
window.advModalClose = function(){ const root=document.getElementById('start-sale-root'); if(root) root.innerHTML=''; };
function advToast(msg){ let t=document.getElementById('adv-toast'); if(!t){ t=document.createElement('div'); t.id='adv-toast'; t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.25);'; document.body.appendChild(t); } t.textContent=msg; t.style.opacity='1'; clearTimeout(t.__h); t.__h=setTimeout(()=>{ t.style.opacity='0'; },2600); }

// ---------- §D DRAWER (dialog semantics + focus trap + Escape + return focus) ----------
let advDrawerReturnEl=null;
function advDrawerKeydown(e){
  const drawer=document.querySelector('.adv-drawer'); if(!drawer) return;
  if(e.key==='Escape'){ e.preventDefault(); advDrawerClose(); return; }
  if(e.key!=='Tab') return;
  const els=Array.prototype.slice.call(drawer.querySelectorAll('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')).filter(el=>!el.disabled && el.offsetParent!==null);
  if(!els.length) return;
  const first=els[0], last=els[els.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}
function advDrawerOpen(kind, title, bodyHtml){
  if(!advDrawerReturnEl || !document.querySelector('.adv-drawer')) advDrawerReturnEl=document.activeElement;
  const root=document.getElementById('adv-drawer-root'); if(!root) return;
  root.innerHTML=`<div class="adv-drawer-overlay" onclick="if(event.target===this)advDrawerClose()"></div>
    <aside class="adv-drawer" data-kind="${kind}" role="dialog" aria-modal="true" aria-labelledby="adv-drawer-title">
      <div class="adv-drawer-head"><h2 id="adv-drawer-title" class="adv-drawer-title">${title}</h2>
        <button class="btn btn-secondary btn-sm" aria-label="Đóng bảng" onclick="advDrawerClose()">✕ Đóng</button></div>
      <div class="adv-drawer-body">${bodyHtml}</div>
    </aside>`;
  document.addEventListener('keydown', advDrawerKeydown, true);
  const drawer=root.querySelector('.adv-drawer');
  const f=drawer.querySelector('button,a[href],input,select,textarea'); if(f) f.focus();
}
window.advDrawerClose=function(){
  const root=document.getElementById('adv-drawer-root'); if(root) root.innerHTML='';
  document.removeEventListener('keydown', advDrawerKeydown, true);
  if(advDrawerReturnEl && advDrawerReturnEl.focus){ try{ advDrawerReturnEl.focus(); }catch(e){} }
  advDrawerReturnEl=null;
};

// Sticky comparison bar — chỉ hiện khi đã chọn >=2 phương án.
function cmpBar(){
  const n=state.compareSet.length;
  if(n<2) return '';
  return `<div class="adv-cmp-bar" role="region" aria-label="Thanh so sánh phương án">
    <span>⚖️ Đang chọn <b>${n}</b> phương án để so sánh</span>
    <span class="adv-cmp-bar-actions">
      <button class="btn btn-secondary btn-sm" onclick="advClearCompare()">Bỏ chọn</button>
      <button class="btn btn-primary btn-sm" onclick="advOpenCompare()">So sánh (${n})</button>
    </span></div>`;
}

// §D — Comparison drawer: phí, coverage, quyền lợi, deductible/copay, waiting, exclusions, verify, fit, gaps.
window.advOpenCompare=function(){
  const refs=state.compareSet.slice(0,3);
  if(refs.length<2){ advToast('Chọn ít nhất 2 phương án để so sánh.'); return; }
  const cols=refs.map(advOfferByRef).filter(Boolean);
  // union hàng theo sản phẩm có mặt (giữ thứ tự, không trùng khoá)
  const rowKeys=[]; const seen={};
  cols.forEach(o=>(BANCA.COMPARE_ROWS[o.productRef]||[]).forEach(([k,l])=>{ if(!seen[k]){ seen[k]=l; rowKeys.push([k,l]); } }));

window.advOpenAlternatives=function(filterNeed){
  const me2=me;
  const served=BANCA.servedNeeds();
  const active=filterNeed||state.primaryNeed;
  const chip=(nid,label)=>`<button class="btn btn-sm ${active===nid?'btn-primary':'btn-secondary'}" onclick="advOpenAlternatives('${nid}')">${label}</button>`;
  const filters=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">${served.map(n=>chip(n,BANCA.needLabel(n))).join('')}</div>`;
  const offers=BANCA.adviceOffersFor(active)||[];
  const bestFit=offers.length?Math.max.apply(null,offers.map(o=>o.fit||0)):0;
  const recommended=(BANCA.recommendPlans(state).plans[0]||{}).primaryOffer||{};
  const rows=offers.map(function(o){
    const ref=advCmpRef(o.productRef,o.packageRef);
    const rd=BANCA.readinessFor?BANCA.readinessFor(o.productRef,me2):{ready:true,canQuote:true};
    const eligible=rd.ready||rd.canQuote;
    const inCmp=state.compareSet.indexOf(ref)>=0;
    const sel=state.selectedOffer&&state.selectedOffer.productRef===o.productRef&&state.selectedOffer.packageRef===o.packageRef;
    const isRec=recommended.productRef===o.productRef&&recommended.packageRef===o.packageRef;
    const trade=[]; if(!isRec && o.fit<bestFit) trade.push('Fit thấp hơn gói đề xuất ('+o.fit+'% so với '+bestFit+'%)'); (o.gaps||[]).forEach(g=>trade.push('Chưa đủ: '+BANCA.needLabel(g)));

      <div style="display:flex;justify-content:space-between;align-items:center;"><b style="font-size:14px;">${o.packageName}</b><span style="font-size:12px;color:var(--ink-500);">Fit ${o.fit}%</span></div>
      <div class="adv-sub">${o.productName}${isRec?' · <span class="badge badge-ready badge-mini">Đề xuất</span>':''}</div>
      <div style="font-size:14px;font-weight:700;color:var(--brand-600);">${o.premiumBand}</div>
      <div style="font-size:12px;"><b style="color:var(--teal-600);">Đáp ứng:</b> ${(o.meets||[]).map(m=>BANCA.needLabel(m)).join(', ')}</div>
      ${trade.length?`<div style="font-size:11px;color:var(--amber-600);">Đánh đổi: ${trade.join(' · ')}</div>`:''}
      ${eligible?'':`<div style="font-size:11px;color:var(--red-600);">${rd.reason||'Chưa đủ điều kiện bán.'}</div>`}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
        <button class="btn btn-sm ${inCmp?'btn-primary':'btn-secondary'}" onclick="advToggleCompareRef('${ref}')">${inCmp?'✓ Đang so sánh':'Thêm vào so sánh'}</button>
        ${eligible?`<button class="btn btn-sm ${sel?'btn-primary':'btn-secondary'}" onclick="advSelectOfferRef('${ref}')">${sel?'✓ Sản phẩm chính':'Chọn làm sản phẩm chính'}</button>`:''}
      </div>
    </div>`;
  }).join('');
  const body=`<div style="font-size:12px;color:var(--ink-500);margin-bottom:12px;">Duyệt sản phẩm theo nhu cầu. Bạn có thể thay sản phẩm chính, thêm vào so sánh — chỉ hiển thị sản phẩm bạn đủ điều kiện bán để chọn.</div>
    ${filters}
    ${offers.length?`<div class="opt-grid" style="grid-template-columns:1fr;">${rows}</div>`:'<div class="empty-state" style="padding:16px;">Nhu cầu này chưa có sản phẩm trong danh mục.</div>'}`;
  advDrawerOpen('alternatives','🔎 Xem sản phẩm khác', body);
};

// ---------- CONVERT TO SALE ----------
function convertReady(){
  if(!state.selectedOffer) return {ok:false, reason:'Chưa chọn phương án — hãy chọn một gói trước khi chuyển sang bán hàng.'};
  const prod = BANCA.products.find(x=>x.id===state.selectedOffer.productRef);
  const st = prod ? (prod.state[me]||'') : '';
  const caps = prod ? (prod.caps[st]||[]) : [];
  if(!prod) return {ok:false, reason:'Sản phẩm không khả dụng với bạn.'};
  if(st==='BLOCKED') return {ok:false, reason:'Bạn đang bị chặn bán sản phẩm này ('+(prod.reason[me]||'thiếu điều kiện')+').'};
  if(st==='SERVICE_UNVERIFIED') return {ok:false, reason:'Readiness service chưa xác thực — thử lại sau.'};
  if(!caps.includes('can_quote') && !caps.includes('can_advise')) return {ok:false, reason:'Bạn chưa đủ điều kiện báo giá sản phẩm này.'};
  return {ok:true};
}

function contextBar(){
  const c = state.bankingContext ? BANCA.bankingContextById(state.bankingContext) : null;
  if(!c) return '';
  return `<div class="card" style="padding:8px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;">
    <span style="color:var(--ink-500);">Ngữ cảnh ngân hàng:</span>
    <b>${c.icon} ${c.label}</b>
    ${BANCA.ui.dataSourceBadge('BANK')}
    <a href="javascript:advGo('needs')" style="color:var(--brand-600);margin-left:auto;">Đổi ngữ cảnh</a>
  </div>`;
}
function stepper(){
  const idx = STEPS.findIndex(s=>s[0]===step);
  return contextBar() + `<div class="adv-steps">${STEPS.map((s,i)=>{
    const cls = i<idx?'done':i===idx?'active':'';
    return `<a href="javascript:advGo('${s[0]}')" style="text-decoration:none;" class="adv-step ${cls}"><span class="n">${i<idx?'✓':i+1}</span>${s[2]||''} ${s[1]}</a>`;
  }).join('')}</div>`;
}

function dataCompleteness(){
  const checks=[state.needProfile.length>0, !!state.primaryNeed, !!state.budgetBand, (state.concerns||[]).length>0, Object.keys(state.dynAnswers||{}).length>0];
  const pct=Math.round(checks.filter(Boolean).length/checks.length*100);
  const missing=[]; if(!state.budgetBand)missing.push('Ngân sách'); if(Object.keys(state.dynAnswers||{}).length===0)missing.push('Câu hỏi mục tiêu'); if((state.concerns||[]).length===0)missing.push('Mối lo ngại');
  return {pct, missing};
}
function riskLevel(){
  const d=state.dynAnswers||{}; let score=0;
  if(d.reserve==='<1 tháng')score+=2; else if(d.reserve==='1–3 tháng')score+=1;
  if(d.dependents==='3+')score+=2; else if(d.dependents==='1–2')score+=1;
  if(d.children==='Có')score+=1; if(d.bhyt==='Không')score+=1;
  return score>=3?['Cao','var(--red-600)']:score>=1?['Trung bình','var(--amber-600)']:['Thấp','var(--teal-600)'];
}

  return `<aside class="adv-side">

      ${metric('Độ phù hợp', (selFit||'—')+(selFit?'%':''), 'var(--brand-600)')}
      <div style="margin-top:12px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-500);"><span>Thông tin đã đủ</span><b style="color:${dc.pct>=60?'var(--teal-600)':'var(--amber-600)'};">${dc.pct}%</b></div>
        <div style="height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px;"><div style="width:${dc.pct}%;height:100%;background:${dc.pct>=60?'var(--teal-600)':'var(--amber-600)'};"></div></div>
        ${dc.missing.length?`<div style="font-size:11px;color:var(--ink-300);margin-top:2px;">Cần thêm: ${dc.missing.join(', ')}</div>`:''}
        ${dc.pct<60?'<div style="font-size:11px;color:var(--amber-600);margin-top:2px;">⚠️ Khuyến nghị hiện là <b>phí minh họa</b> (ước tính) — bổ sung thông tin để chính xác hơn.</div>':''}
      </div>
    </div>
    <div class="card" style="padding:14px 16px;">
      <div class="label" style="margin-bottom:8px;">📝 Ghi chú tư vấn</div>

function footer(){
  const idx = STEPS.findIndex(s=>s[0]===step);
  const prev = idx>0?STEPS[idx-1][0]:null;
  const next = idx<STEPS.length-1?STEPS[idx+1][0]:null;
  let primary='';
  if(step==='result'){
    if(locked){ primary = `<span class="chip" style="background:#eef0f4;color:var(--ink-500);">🔒 Phiên đã khoá (${state.status==='CONVERTED_TO_SALE'?'đã chuyển bán':'chưa quan tâm'})</span>`; }
    else { const chk = convertReady();
    primary = chk.ok
      ? `<button class="btn btn-primary" onclick="advConvert()">Tạo bản chào từ tư vấn này →</button>`
      : `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;"><span style="font-size:12px;color:var(--amber-600);max-width:340px;text-align:right;">⚠️ ${chk.reason}</span>${(!state.selectedOffer)?`<button class="btn btn-secondary" onclick="advGo('recommend')">← Chọn gói</button>`:''}<button class="btn btn-primary" disabled style="opacity:.45;cursor:not-allowed;" title="${chk.reason}">Tạo bản chào từ tư vấn này →</button></div>`; }
  } else if(next){
    const disabled = (step==='needs' && !state.primaryNeed);
    primary = `${disabled?'<span style="font-size:11px;color:var(--amber-600);">Chọn ít nhất 1 nhu cầu để tiếp tục</span> ':''}<button class="btn btn-primary" ${disabled?'disabled style="opacity:.5;"':''} onclick="advGo('${next}')">Tiếp tục →</button>`;
  }
  return `<div class="adv-footer">
    <div style="display:flex;gap:8px;align-items:center;">
      ${prev?`<button class="btn btn-secondary" onclick="advGo('${prev}')">← Quay lại</button>`:''}
    </div>
    <div style="display:flex;gap:12px;align-items:center;">
      ${primary}
    </div>
  </div>`;
}

window.advTransferSeller = function(pkgRef){
  const offers = state.primaryNeed? BANCA.adviceOffersFor(state.primaryNeed):[];
  const o = offers.find(x=>x.packageRef===pkgRef)||{};
  const P = BANCA.personas||{};
  const meObj = P[me]||{};
  // Danh sách nhân viên tư vấn đủ điều kiện (ACTIVE, không phải mình, không service error)
  const all = Object.keys(P).map(id=>({id,...P[id]}))
    .filter(s=>s.id!==me && s.status==='ACTIVE' && !s.serviceError && ['Retail RM','Sales Team Leader'].includes(s.role));
  // Nhân viên tư vấn gợi ý: cùng team + cùng branch ưu tiên, Retail RM trước
  const scoreOf=s=>(s.team===meObj.team?2:0)+(s.branch===meObj.branch?1:0)+(s.role==='Retail RM'?1:0);
  const sorted=[...all].sort((a,b)=>scoreOf(b)-scoreOf(a));
  const suggested=sorted[0];
  const rest=sorted.slice(1);
  const row=(s,hi)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border:1px solid ${hi?'var(--teal-600)':'var(--line)'};background:${hi?'#eefaf7':'#fff'};border-radius:8px;margin-bottom:8px;">

      <button class="btn btn-primary btn-sm" onclick="advDoTransfer('${s.id}','${(s.name||'').replace(/'/g,'')}')">Chuyển</button>
    </div>`;
  advModal(`<div style="font-size:14px;font-weight:700;margin-bottom:2px;">Chuyển tư vấn cho nhân viên tư vấn đủ điều kiện</div>
   <div style="font-size:12px;color:var(--ink-500);margin-bottom:12px;">Gói <b>${o.packageName||''}</b> · ${o.productName||''}. Bạn chưa đủ điều kiện bán — chọn nhân viên tư vấn nhận bàn giao bản tư vấn (demo).</div>
   ${suggested?`<div class="label" style="margin-bottom:6px;">⭐ Nhân viên tư vấn gợi ý</div>${row(suggested,true)}`:''}
   <div class="label" style="margin:12px 0 6px;">Danh sách nhân viên tư vấn đủ điều kiện</div>
   ${rest.length?rest.map(s=>row(s,false)).join(''):'<div style="font-size:12px;color:var(--ink-300);">Không có nhân viên tư vấn khác.</div>'}
   <div style="display:flex;justify-content:flex-end;margin-top:6px;"><button class="btn btn-secondary btn-sm" onclick="advModalClose()">Đóng</button></div>`);
};

}

// §B — thẻ một phương án (plan): sản phẩm chính · bổ trợ · tổng phí · đáp ứng · còn thiếu · lý do · xác minh.
function planCard(plan){
  const sel = state.selectedPlan && state.selectedPlan.id===plan.id;
  const tagCls = plan.id==='BUDGET_FIT'?'budget':'fuller';
  const cmpRef = advCmpRef(plan.primaryOffer.productRef, plan.primaryOffer.packageRef);
  const inCmp = state.compareSet.indexOf(cmpRef)>=0;
  return `<div class="plan-card ${sel?'sel':''}">
    <div class="adv-kv" style="align-items:center;"><span class="plan-tag ${tagCls}">${plan.label}</span><span class="k">Điểm phù hợp ${plan.score}</span></div>
    <div class="adv-sub">${plan.desc}</div>
    <div><span class="label">Sản phẩm chính</span><div style="font-weight:700;">${plan.primaryOffer.productName} · ${plan.primaryOffer.packageName}</div></div>
    ${plan.addOns.length?`<div><span class="label">Bổ trợ</span><div class="adv-chips">${plan.addOns.map(o=>`<span class="badge badge-base badge-mini">${o.productName} · ${o.packageName}</span>`).join('')}</div></div>`:'<div class="adv-hint">Tùy chọn: chưa thêm sản phẩm bổ trợ</div>'}
    <div class="adv-kv sm"><span class="k">Tổng phí (minh họa)</span><b style="color:var(--brand-600);">${plan.totalMonthlyLabel}</b></div>
    <div class="adv-sub"><b style="color:var(--teal-600);">Đáp ứng:</b> ${plan.coveredNeeds.map(n=>BANCA.needLabel(n)).join(', ')||'—'}</div>
    ${plan.remainingGaps.length?`<div class="adv-sub"><b style="color:var(--amber-600);">Còn thiếu:</b> ${plan.remainingGaps.map(n=>BANCA.needLabel(n)).join(', ')}</div>`:'<div class="adv-sub" style="color:var(--teal-600);">✓ Phủ toàn bộ nhu cầu đã chọn</div>'}
    <div class="adv-sub">${plan.why}</div>
    ${plan.verify.length?`<div class="adv-hint">Cần xác minh khi bán: ${plan.verify.join(', ')}</div>`:''}
    <div class="adv-chips">
      <button class="btn btn-sm ${sel?'btn-primary':'btn-secondary'}" onclick="advSelectPlan('${plan.id}')">${sel?'✓ Đã chọn phương án':'Chọn phương án'}</button>
      <button class="btn btn-sm ${inCmp?'btn-primary':'btn-secondary'}" onclick="advToggleCompareRef('${cmpRef}')">${inCmp?'✓ Đang so sánh':'Thêm vào so sánh'}</button>
    </div>
  </div>`;
}

function bodyRecommend(){
  if(!state.primaryNeed) return `<div class="card"><div class="empty-state">Chưa xác định nhu cầu. <a href="javascript:advGo('needs')">Quay lại khám phá nhu cầu</a>.</div></div>`;
  const offers = BANCA.adviceOffersFor(state.primaryNeed);
  // §15.3 — nhu cầu chưa có sản phẩm: nói RÕ lý do + đưa lối đi tiếp,
  // KHÔNG im lặng gợi ý sản phẩm của nhóm khác.
  if(!offers.length){
    const cov = BANCA.needCoverage(state.primaryNeed);
    const alts = BANCA.servedNeeds().filter(n=>n!==state.primaryNeed).slice(0,4);
    return `<div class="card" style="padding:18px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:4px;">Chưa có sản phẩm cho nhu cầu "${BANCA.needLabel(state.primaryNeed)}"</div>
      <div class="alert2 warn" style="margin:8px 0;">${cov.reason||'Nhu cầu này chưa có sản phẩm trong danh mục.'}</div>
      <div style="font-size:13px;color:var(--ink-500);margin-bottom:8px;">Nhu cầu đang có sản phẩm bán được:</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">${alts.map(n=>`<button class="btn btn-secondary btn-sm" onclick="advSetPrimary('${n}')">${BANCA.needLabel(n)}</button>`).join('')}</div>
      <div style="margin-top:12px;"><a href="javascript:advGo('needs')" style="font-size:12px;color:var(--brand-600);">← Chọn lại nhu cầu</a></div>
    </div>`;
  }
  // Phục vụ GIÁN TIẾP → nói rõ đang dùng sản phẩm nào để đáp ứng, tránh hiểu nhầm.
  const _cov = BANCA.needCoverage(state.primaryNeed);
  const covNote = _cov.note ? `<div class="alert2 info" style="margin:0 0 12px;">${_cov.note}</div>` : '';
  if(state.status==='IN_PROGRESS') { state.status='RECOMMENDED'; persist(state); }
  const bestFit=Math.max.apply(null, offers.map(o=>o.fit||0));
  // §A — khoảng trống bảo vệ từ input+config: giả định → cách tính → gap → % → disclaimer.
  const pg=BANCA.protectionGap(state);
  const tc={ink:'var(--ink-700)',teal:'var(--teal-600)',amber:'var(--amber-600)',red:'var(--red-600)'};
  const gapCard=`<div class="card" style="padding:16px;margin-bottom:12px;border-left:4px solid var(--amber-600);">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;"><span style="font-size:22px;">${pg.icon}</span><b>${pg.title}</b><span class="badge badge-mini ${pg.personalized?'badge-ready':'badge-version'}">${pg.scenarioLabel}</span></div>
    <div class="label" style="margin:8px 0 4px;">Giả định đầu vào</div>
    <div class="adv-grid-kv" style="margin-bottom:8px;">${pg.assumptions.map(a=>`<div class="adv-kv"><span class="k">${a.label}${a.provided?'':' <span class="badge badge-version badge-mini">mặc định</span>'}</span><b>${a.value}</b></div>`).join('')}</div>
    <div class="label" style="margin:8px 0 4px;">Cách tính</div>
    <div class="adv-grid-kv">${pg.breakdown.map(b=>`<div class="adv-kv sm"><span class="k">${b.op?('<span style="color:var(--ink-300);">'+b.op+'</span> '):''}${b.label}</span><b style="color:${tc[b.tone]||'var(--ink-700)'};">${BANCA.vnd(b.amount)}</b></div>`).join('')}</div>
    <div style="margin-top:10px;"><div style="height:10px;background:var(--line);border-radius:6px;overflow:hidden;"><div style="width:${pg.gapPct}%;height:100%;background:var(--red-600);"></div></div><div class="adv-hint" style="margin-top:4px;">Mức độ khoảng trống ~${pg.gapPct}% — bảo hiểm giúp lấp phần này.</div></div>
    <div class="adv-hint" style="margin-top:6px;">${pg.disclaimer}</div>
  </div>`;
  // §B — phương án cho nhiều nhu cầu (>=2). 1 nhu cầu giữ nguyên hành vi (chỉ thẻ offer bên dưới).
  const needCount=(state.needProfile||[]).length;
  const rec=BANCA.recommendPlans(state);
  const plansBlock = needCount>=2 ? (rec.plans.length ? `<div class="card" style="padding:18px;margin-bottom:12px;">
      <h3 style="margin:0 0 4px;font-size:16px;">🧩 Phương án cho ${needCount} nhu cầu</h3>
      <p style="margin:0 0 12px;color:var(--ink-500);font-size:13px;">Mỗi phương án nêu rõ nhu cầu đáp ứng, nhu cầu còn thiếu, tổng phí và lý do. So sánh là hành động phụ (tùy chọn).</p>
      <div class="plan-grid">${rec.plans.map(planCard).join('')}</div>
    </div>` : `<div class="card" style="padding:18px;margin-bottom:12px;"><div class="empty-state" style="padding:16px;">Chưa có phương án đủ điều kiện cho tổ hợp nhu cầu này. Hãy chọn nhu cầu có sản phẩm, hoặc bấm <b>Xem sản phẩm khác</b>.</div></div>`) : '';
  // §10 — Quick Advice Health: ước tính gia đình theo nhóm tuổi (không thu khai báo/OTP/tài liệu y tế).
  const famEst = (offers[0] && offers[0].productRef==='health' && BANCA.healthQuickAdviceEstimate) ? (function(){
    const pkgCode = (BANCA.HEALTH_ADVICE_PKG||{})[(state.selectedOffer&&state.selectedOffer.packageRef)||offers[0].packageRef] || 'HEALTH_STD';
    const est = BANCA.healthQuickAdviceEstimate({packageCode:pkgCode});
    const rows = est.lines.map(function(l){return `<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0;border-bottom:1px dashed var(--line);"><span style="color:var(--ink-500);">${l.label} × ${l.count}</span><b>${BANCA.vnd(l.sub)}</b> <span style="font-size:11px;color:var(--ink-300);">(${BANCA.vnd(l.per)}/người)</span></div>`;}).join('');
    return `<div class="card" style="padding:16px;margin-bottom:12px;border-left:4px solid var(--brand-600);">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><span style="font-size:20px;">👨‍👩‍👧</span><b style="font-size:14px;">Ước tính gói gia đình (${((BANCA.healthPackages||{})[pkgCode]||{}).name||pkgCode})</b></div>
      <div style="font-size:11px;color:var(--ink-500);margin-bottom:8px;">Gia đình minh họa: ${est.members} người theo nhóm tuổi. Quick advice — chưa thu khai báo sức khỏe / người thụ hưởng / OTP / tài liệu y tế.</div>
      ${rows}
      ${est.discount?`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--teal-600);padding:4px 0;"><span>Chiết khấu gia đình (≥3 người)</span><b>−${BANCA.vnd(est.discount)}</b></div>`:''}
      <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:800;padding:8px 0 0;border-top:1px solid var(--line);margin-top:4px;color:var(--brand-600);"><span>Tổng gia đình (ước tính)</span><span>${BANCA.vnd(est.total)}</span></div>
      <div style="font-size:11px;color:var(--amber-600);margin-top:8px;">⚠ ${est.waiting}</div>
      <div style="font-size:11px;color:var(--ink-500);margin-top:4px;">Cần kiểm khi tạo yêu cầu: ${est.verify.join(' · ')}.</div>
    </div>`;
  })() : '';
  return covNote+gapCard+famEst+plansBlock+`<div class="card" style="padding:18px;margin-bottom:12px;"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;"><div><h3 style="margin:0 0 4px;font-size:16px;">⭐ ${needCount>=2?'Sản phẩm cho nhu cầu chính':'Gợi ý phương án'}: ${BANCA.needLabel(state.primaryNeed)}</h3><p style="margin:0;color:var(--ink-500);font-size:13px;">Mỗi phương án đều giải thích rõ vì sao đề xuất. Phí là minh họa.</p></div><button class="btn btn-secondary btn-sm" onclick="advOpenAlternatives()">🔎 Xem sản phẩm khác</button></div></div>
  <div class="opt-grid">${offers.map(o=>{
    const exp=BANCA.explainOffer(o, state.budgetBand);
    const isHero=o.fit===bestFit;
    const inCompare = state.compareSet.includes(advCmpRef(o.productRef,o.packageRef));
    const selected = state.selectedOffer && state.selectedOffer.packageRef===o.packageRef;
    const rd = BANCA.readinessFor ? BANCA.readinessFor(o.productRef) : {ready:true, canQuote:true};
    const eligible = rd.ready || rd.canQuote;               // hardEligibilityFilter (readiness)
    const issue = issueModeOf(o.packageRef);
    return `<div class="opt-card ${selected?'sel':''}" style="${!eligible?'opacity:.55;':''}${isHero?'border:2px solid var(--teal-600);box-shadow:0 6px 20px rgba(13,122,108,.15);grid-row:span 1;':''}">
      ${isHero?'<div style="background:var(--teal-600);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:6px;display:inline-block;margin-bottom:6px;">⭐ BEST MATCH</div>':''}
      <div style="display:flex;justify-content:space-between;align-items:center;"><span class="badge ${o.tier==='PROTECT'?'badge-pending':o.tier==='SAVE'?'badge-conditional':'badge-ready'}">${o.badge}</span><span style="font-size:${isHero?'15px':'12px'};font-weight:${isHero?'800':'400'};color:${isHero?'var(--teal-600)':'var(--ink-500)'};">Fit ${o.fit}% ${tip('fit')}</span></div>
      <div><div style="font-weight:700;font-size:${isHero?'19px':'15px'};">${o.packageName}</div><div style="font-size:12px;color:var(--ink-500);">${o.productName}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${eligible?'<span class="badge badge-ready" style="font-size:9px;">Được phép bán</span>':'<span class="badge badge-blocked" style="font-size:9px;">Không đủ điều kiện</span>'}
        <span class="badge badge-version" style="font-size:9px;">Cấp đơn: ${issueModeLabel(issue)} ${tip('issue')}</span>
      </div>
      <div style="font-size:18px;font-weight:700;color:var(--brand-600);">${o.premiumBand} ${tip('indicative')}</div>
      <div style="font-size:12px;color:var(--ink-500);">${o.premiumMonthly} · minh họa</div>
      <div style="font-size:12px;"><b style="color:var(--teal-600);">Đáp ứng:</b> ${o.meets.map(m=>BANCA.needLabel(m)).join(', ')}</div>
      ${o.gaps.length?`<div style="font-size:12px;"><b style="color:var(--amber-600);">Chưa đủ:</b> ${o.gaps.map(m=>BANCA.needLabel(m)).join(', ')}</div>`:''}
      <div style="font-size:12px;color:var(--ink-500);">${o.why}</div>
      <div style="border-top:1px dashed var(--line);padding-top:8px;">
        <div style="font-size:11px;font-weight:700;color:${exp.recommended?'var(--teal-600)':'var(--amber-600)'};">${exp.recommended?'Vì sao đề xuất?':'Không khuyến nghị vì'}</div>
        ${(exp.recommended?exp.pros:exp.cons).slice(0,5).map(x=>`<div style="font-size:11px;color:var(--ink-600);">${exp.recommended?'✓':'✕'} ${x}</div>`).join('')}
      </div>
      <div style="font-size:11px;color:var(--ink-300);">Tài liệu dự kiến: ${docHintOf(o.productRef)}</div>
      <div style="font-size:11px;color:var(--ink-300);">Cần xác minh khi bán: ${o.verify.join(', ')}</div>
      <div style="font-size:11px;color:var(--ink-300);">Thời gian phát hành dự kiến: <b>${o.issueTime||'—'}</b></div>
      ${!eligible?`<div style="border:1px solid var(--red-600);background:#fdecec;border-radius:8px;padding:8px;font-size:11px;"><div>Phù hợp nhu cầu: <b style="color:var(--teal-600);">CÓ</b> · Được phép bán: <b style="color:var(--red-600);">KHÔNG</b></div><div style="color:var(--red-600);margin-top:2px;">${rd.reason||'Nhân viên tư vấn chưa đủ điều kiện bán sản phẩm này.'}</div></div>`:''}
      <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">
        <button class="btn btn-sm ${inCompare?'btn-primary':'btn-secondary'}" onclick="advToggleCompareRef('${advCmpRef(o.productRef,o.packageRef)}')">${inCompare?'✓ Đang so sánh':'Thêm vào so sánh'}</button>
        ${eligible
          ? `<button class="btn btn-sm ${selected?'btn-primary':'btn-secondary'}" onclick="advSelectOffer('${o.packageRef}')">${selected?'✓ Đã chọn':'Chọn phương án'}</button>`
          : `<button class="btn btn-sm btn-secondary" onclick="advTransferSeller('${o.packageRef}')">Chuyển nhân viên tư vấn đủ điều kiện</button>`}
      </div>
    </div>`;
  }).join('')}</div>`;
}

// §D — bodyCompare đã bỏ: so sánh chuyển thành drawer tùy chọn (advOpenCompare).

      <div><h3 style="margin:0;font-size:20px;">🎯 Kết quả tư vấn ${state.id}</h3><div style="font-size:13px;color:var(--ink-500);margin-top:2px;">${state.mode==='ANONYMOUS'?'Ẩn danh':(state.customerName||state.customerRef||'Khách hàng')} · nhu cầu chính ${state.primaryNeed?BANCA.needLabel(state.primaryNeed):'chưa xác định'}</div></div>

      <tr><td style="color:var(--ink-500);">Ngân sách</td><td>${state.budgetBand?BANCA.budgetLabel(state.budgetBand):'—'}</td></tr>

      <tr><td style="color:var(--ink-500);">Phí minh họa</td><td>${o?o.premiumBand+' <span class="help-hint" tabindex=0 title="Ph\u00ed minh h\u1ecda, kh\u00f4ng ph\u1ea3i ph\u00ed ch\u00ednh th\u1ee9c.">?</span>':'—'}</td></tr>
      <tr><td style="color:var(--ink-500);">Lý do đề xuất</td><td>${o?(BANCA.adviceOffersFor(state.primaryNeed).find(x=>x.packageRef===o.packageRef)||{}).why||'—':'—'}</td></tr>
      <tr><td style="color:var(--ink-500);">Cần bổ sung khi chuyển bán</td><td>${o?((BANCA.adviceOffersFor(state.primaryNeed).find(x=>x.packageRef===o.packageRef)||{}).verify||[]).join(', ')||'—':'Chọn gói trước'}</td></tr>
    </tbody></table>
    ${state.selectedPlan?`<div class="card" style="padding:14px;margin-top:12px;border-left:4px solid var(--brand-600);"><div class="label" style="margin-bottom:6px;">Phương án đã chọn: ${state.selectedPlan.label}</div><div style="font-size:12px;color:var(--ink-600);">Gồm: ${state.selectedPlan.offers.map(x=>x.productName+' · '+x.packageName).join(' + ')}</div><div style="font-size:12px;color:var(--ink-500);margin-top:4px;">Đáp ứng: ${(state.selectedPlan.coveredNeeds||[]).map(n=>BANCA.needLabel(n)).join(', ')||'—'}${(state.selectedPlan.remainingGaps||[]).length?' · Còn thiếu: '+state.selectedPlan.remainingGaps.map(n=>BANCA.needLabel(n)).join(', '):''}</div></div>`:''}
    ${(()=>{ const offers=BANCA.adviceOffersFor(state.primaryNeed); const ds=BANCA.decisionSupport(offers, o?o.packageRef:null); return ds.length?`<div class="card" style="padding:14px;margin-top:12px;background:var(--brand-100);border-color:transparent;"><div class="label" style="margin-bottom:8px;">Hỗ trợ ra quyết định</div>${ds.map(([q,a])=>`<div style="margin-bottom:8px;"><div style="font-size:12px;font-weight:700;">${q}</div><div style="font-size:12px;color:var(--ink-600);">${a}</div></div>`).join('')}</div>`:''; })()}
    <div style="margin-top:14px;"><div class="label" style="margin-bottom:6px;">Có thể bổ sung (gợi ý — không tự thêm)</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${BANCA.RIDER_CATALOG.map(rd=>{const on=(state.upsell||[]).includes(rd.id);return `<button class="btn btn-sm ${on?'btn-primary':'btn-secondary'}" onclick="advToggleUpsell('${rd.id}')">${on?'✓ ':''}${rd.label} +${BANCA.vnd(rd.addMonthly)}/tháng</button>`;}).join('')}</div>${(state.upsell||[]).length?`<div style="font-size:11px;color:var(--ink-500);margin-top:6px;">Đã ghi nhận gợi ý bổ sung: ${(state.upsell||[]).map(id=>(BANCA.RIDER_CATALOG.find(r=>r.id===id)||{}).label).join(', ')} — chỉ gợi ý, khách quyết định khi tạo yêu cầu.</div>`:''}</div>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;"><span class="label">Xuất bản tư vấn:</span><button class="btn btn-secondary btn-sm" onclick="advExport('PDF')">📄 Tải PDF</button><button class="btn btn-secondary btn-sm" onclick="advExport('EMAIL')">✉️ Email</button><button class="btn btn-secondary btn-sm" onclick="advExport('QR')">🔳 Chia sẻ QR</button></div>
    ${(()=>{ const dur=state.startedAt?Math.max(1,Math.round((Date.now()-state.startedAt)/60000)):'—'; return `<div class="card" style="padding:12px 14px;margin-top:12px;background:var(--paper);border-color:transparent;"><div class="label" style="margin-bottom:6px;">Phiên tư vấn</div><div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-500);"><span>Tư vấn viên: <b style="color:var(--ink-700);">${(BANCA.personas[state.createdBy]||{}).name||state.createdBy}</b></span><span>Bắt đầu: <b style="color:var(--ink-700);">${state.startedAt?new Date(state.startedAt).toLocaleTimeString('vi-VN').slice(0,5):'—'}</b></span><span>Lưu gần nhất: <b style="color:var(--ink-700);">${state.updatedAt}</b></span><span>Thời lượng: <b style="color:var(--ink-700);">${dur} phút</b></span><span>Phiên bản: <b style="color:var(--ink-700);">v${state.version}</b></span></div>${state.mode==='ANONYMOUS'?'<div style="font-size:11px;color:var(--amber-600);margin-top:6px;">⚠️ Phiên ẩn danh — chưa lưu vào CRM cho đến khi chuyển sang bán hàng.</div>':''}</div>`; })()}
    <div style="margin-top:12px;font-size:12px;color:var(--ink-300);">Disclaimer: Kết quả tư vấn và phí chỉ mang tính minh họa, chưa phải cam kết bảo hiểm. Phí chính thức được tính lại tại bước lập báo giá khi chuyển sang bán hàng.</div>
    ${locked?'':`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;">
      <button class="btn btn-secondary" onclick="advSendResult()">Gửi kết quả</button>
      <button class="btn btn-secondary" onclick="advFollowUp()">Hẹn tư vấn sau</button>
      <button class="btn btn-secondary" onclick="advNotInterestedConfirm()" style="color:var(--red-600);">Ghi nhận chưa quan tâm</button>
    </div>`}
    <div style="margin-top:8px;font-size:11px;color:var(--ink-300);">Nút <b>Tạo bản chào từ tư vấn này</b> ở thanh dưới. ${!chk.ok?'<span style="color:var(--amber-600);">'+chk.reason+'</span>':''}</div>
  </div>`;
}

function stepBody(){
  if(step==='needs') return bodyNeeds();
  if(step==='priority') return bodyPriority();
  if(step==='recommend') return bodyRecommend();
  return bodyResult();
}

function renderStep(){
  // in-place re-render of main content + sidebar without full navigation
  const main=document.getElementById('adv-main'); if(main) main.innerHTML = stepper()+stepBody()+cmpBar();
  const side=document.getElementById('adv-side-wrap'); if(side) side.innerHTML = sidebar();
  const foot=document.getElementById('adv-foot'); if(foot) foot.outerHTML = `<div id="adv-foot">${footer()}</div>`;
}

// auto-convert entry from list "convert=1"
if(qs.get('convert')==='1' && step==='result'){ setTimeout(()=>{ advConvert(); }, 60); }

const layout = `<div class="adv-layout">
  <div id="adv-main">${stepper()}${stepBody()}${cmpBar()}</div>
  <div id="adv-side-wrap">${sidebar()}</div>
</div>
<div id="adv-foot">${footer()}</div>
<div id="adv-drawer-root"></div>`;

shell('Tư vấn nhanh','Không gian tư vấn', layout, {startSale:false});
}
</script></body></html>
