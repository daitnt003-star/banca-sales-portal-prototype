<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bản chào — Banca Sales Portal</title><script src="../../shared/js/head-loader.js?v=44"></script></head><body><script>
// Thin wrapper — dùng chung BANCA.ui.quoteListShell + quoteDataTable (1 shell / 1 table cho mọi lifecycle).
const p = BANCA.persona(), me = BANCA.current(), r = rel();
const qs = new URLSearchParams(location.search);
if(p.status!=='ACTIVE'){
 shell('Bản chào','Bản chào',`<div class="card"><div class="alert2 danger">Tài khoản ngừng hoạt động.</div></div>`,{startSale:false});
} else {
 const g5 = qs.get('g5') || 'PROCESSING';
 const lifecycle = BANCA.G5_TO_LIFECYCLE[g5] || 'PROCESSING';
 const SCOPES = (BANCA.availableScopes?BANCA.availableScopes(me):['SELF']);
 const fScope = SCOPES.includes(qs.get('scope'))?qs.get('scope'):'SELF';
 const fUnit = qs.get('unit')||null;
 const fSearch = (qs.get('q')||'').toLowerCase();
 const canSell = (BANCA.resolveManagerProfile?BANCA.resolveManagerProfile(me).sellingEnabled!==false:true);

 // Data: SUBMITTED trong scope → lifecycle → unit → quick filter → search.
 let all = (fScope==='SELF')
   ? BANCA.myApps('SUBMITTED').filter(a=>a.owner===me)
   : (BANCA.appsForScope?BANCA.appsForScope(fScope,me):BANCA.myApps('SUBMITTED')).filter(a=>a.submissionState==='SUBMITTED');
 all = BANCA.applyUnitFilter(all, fUnit);
 const total = all.length;
 let apps = all.filter(a=>BANCA.lifecycleOf(a)===lifecycle);
 apps = BANCA.applyGroupFilters(apps, g5, qs, me);
 // Advanced filters (detail status/UW/product/date) — không phơi thành chip.
 const fProd = qs.get('prod')||'ALL', fUW = qs.get('uw')||'ALL', fFrom = qs.get('from')||'', fTo = qs.get('to')||'';
 if(fProd!=='ALL') apps = apps.filter(a=>a.productId===fProd);
 if(fUW!=='ALL') apps = apps.filter(a=>a.uw && a.uw.decision===fUW);
 if(fFrom) apps = apps.filter(a=>(a.updatedAt||'').slice(0,10)>=fFrom);
 if(fTo) apps = apps.filter(a=>(a.updatedAt||'').slice(0,10)<=fTo);
 if(fSearch) apps = apps.filter(a=>{ const c=BANCA.customerById(a.customerId)||{}; return (c.name||'').toLowerCase().includes(fSearch)||(c.phone||'').includes(fSearch)||a.id.toLowerCase().includes(fSearch); });
 apps.sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));

 const counts = BANCA.quoteLifecycleCounts(me, fScope, fUnit);
 const drawerFields=[
  {name:'prod', label:'Sản phẩm', type:'select', value:fProd, options:[['ALL','Mọi sản phẩm'],...[...new Set(all.map(a=>a.productId))].map(x=>[x,(BANCA.products.find(pp=>pp.id===x)||{}).name||x])]},
  {name:'uw', label:'Kết quả thẩm định', type:'select', value:fUW, options:[['ALL','Mọi KQ thẩm định'],...Object.entries(BANCA.UW_DECISIONS).map(([k,v])=>[k,v.label])]},
  {name:'from', label:'Nộp từ ngày', type:'date', value:fFrom},
  {name:'to', label:'Nộp đến ngày', type:'date', value:fTo}
 ];
 const fd = filterDrawer(drawerFields, {g5:g5, q:qs.get('q')||''});

 const body = BANCA.ui.quoteListShell({
   me, r, lifecycle, g5, counts, scope:fScope, unit:fUnit, q:qs.get('q')||'',
   apps, shown:apps.length, total, canSell,
   quickFiltersHtml: BANCA.ui.offerQuickFilters(g5, qs, r),
   advancedBtn: fd.button, advancedTags: fd.tags, advancedDrawer: fd.drawer
 });
 shell('Bản chào','Bản chào', body, {startSale:false});
}
</script></body></html>
