<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trang chủ — Banca Sales Portal</title><script src="../../shared/js/head-loader.js?v=44"></script></head><body><script>
const p = BANCA.persona();
const me = BANCA.current();
const r = rel();

if(p.status!=='ACTIVE'){
 const _inDate=p.inactiveSince?(String(p.inactiveSince).match(/(\d{4})-(\d{2})-(\d{2})/)?RegExp.$3+'/'+RegExp.$2+'/'+RegExp.$1:p.inactiveSince):'';
 shell('Trang chủ','Tài khoản ngừng hoạt động',`<div class="card"><div class="alert2 danger"><b>Tài khoản của bạn đã ngừng hoạt động${_inDate?' từ '+_inDate:''}.</b><br>Mọi chức năng bán hàng bị khóa. Vui lòng liên hệ bộ phận quản trị kênh phân phối để được hỗ trợ.</div></div>`,{startSale:false});
} else if(p.serviceError){
 // Lỗi hệ thống xác thực điều kiện bán (readiness service không phản hồi) → chặn an toàn (default deny).
 shell('Trang chủ','Không xác thực được điều kiện bán hàng',`<div class="card"><div class="alert2 danger"><b>Chưa thể xác thực điều kiện bán hàng của bạn.</b><br>Hệ thống tạm thời không kết nối được tới dịch vụ kiểm tra quyền bán / chứng chỉ. Để đảm bảo an toàn, các thao tác bán hàng tạm khóa cho tới khi kết nối được khôi phục.</div>
   <div style="margin-top:12px;font-size:13px;color:var(--ink-600);">Bạn có thể:</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;"><button class="btn btn-primary btn-sm" onclick="location.reload()">Thử lại</button><a class="btn btn-secondary btn-sm" href="${r}modules/help/index.html">Liên hệ hỗ trợ</a></div>
   <div style="font-size:11.5px;color:var(--ink-300);margin-top:12px;">Nếu tình trạng kéo dài, vui lòng báo bộ phận quản trị kênh phân phối để kiểm tra đồng bộ dữ liệu.</div>
 </div>`,{startSale:false});
} else if(BANCA.isManagerProfile(me) && !BANCA.resolveManagerProfile(me).sellingEnabled){
 // Manager chỉ quản lý → Trang chủ CHÍNH LÀ Manager Cockpit (không hiển thị dashboard cá nhân).
 location.replace(r+'modules/team-workspace/index.html');
} else {

// Player-coach (vừa bán vừa quản lý): Trang chủ có scope tab [Cá nhân][Quản lý] ngay trên đầu.
const _mgr = BANCA.isManagerProfile(me);
const homeScopeTabs = _mgr
 ? `<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;"><span class="tab" style="padding:8px 18px;border-radius:9px;font-size:13.5px;background:var(--brand-600);color:#fff;font-weight:600;">Cá nhân</span><a href="${r}modules/team-workspace/index.html" class="tab" style="text-decoration:none;padding:8px 18px;border-radius:9px;font-size:13.5px;background:var(--paper-card);color:var(--ink-500);border:1px solid var(--line);">Quản lý</a></div>`
 : '';

// Dữ liệu
const drafts = BANCA.myApps('NOT_SUBMITTED').filter(a=>a.owner===me).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));
const submitted = BANCA.myApps('SUBMITTED').filter(a=>a.owner===me);
const needMore = submitted.filter(a=>a.status==='NEED_MORE_INFO');
const counts = {
 PENDING_UW: submitted.filter(a=>['PENDING_RECEIPT','PENDING_UW'].includes(a.status)).length,
 IN_UW: submitted.filter(a=>a.status==='IN_UW').length,
 CONFIRM: submitted.filter(a=>['UW_DECIDED','PENDING_CUSTOMER_CONFIRM'].includes(a.status)).length,
 PAYMENT: submitted.filter(a=>a.status==='PENDING_PAYMENT').length,
 PAID: submitted.filter(a=>['PAID','PENDING_ISSUE'].includes(a.status)).length
};
const pols = BANCA.myPolicies().filter(x=>x.owner===me);
const newPols = pols.filter(x=>x.isNew);
const renewals = pols.filter(x=>x.renewalStatus==='RENEWAL_DUE');
const notis = BANCA.notifications[me]||[];
const kpi = BANCA.kpi[me]||{premium:0,policies:0,conversion:'—',target:'—'};
const commission = BANCA.commissionSummary(me);
const showCommission = BANCA.commissionVisible('home');

const wsUrl = id => r+'modules/application-workspace/index.html?id='+id;

// 2. Yêu cầu bảo hiểm chưa nộp gần đây (max 5)
const draftRows = drafts.slice(0,5).map(a=>`<tr>
 <td><a href="${wsUrl(a.id)}" style="font-weight:600;color:var(--brand-600);">${a.id}</a></td>
 <td>${custName(a.customerId)}</td><td style="font-size:12px;">${a.productName}</td>
 <td style="font-size:12px;">${BANCA.stageLabel(a.currentStage)}</td>
 <td><div class="progress" style="width:70px;height:6px;background:var(--line);border-radius:4px;"><div style="width:${a.progress}%;height:6px;background:var(--brand-600);border-radius:4px;"></div></div><span style="font-size:11px;color:var(--ink-500);">${a.progress}%</span></td>
 <td>${warnBadges(a.warnings)||'<span style="color:var(--ink-300);font-size:11px;">—</span>'}</td>
 <td style="font-size:11.5px;color:var(--ink-500);">${a.updatedAt}</td>
 <td><a class="btn btn-primary btn-sm" href="${wsUrl(a.id)}">Tiếp tục</a></td></tr>`).join('');

// 3. Yêu cầu cần bổ sung
const needRows = needMore.map(a=>`<tr>
 <td><a href="${wsUrl(a.id)}" style="font-weight:600;color:var(--brand-600);">${a.id}</a></td>
 <td>${custName(a.customerId)}</td>
 <td><span class="chip">${a.supplement.type==='DOCUMENT'?'Tài liệu':'Thông tin'}</span></td>
 <td style="font-size:12px;">${a.supplement.items.join('; ')}</td>
 <td style="font-size:12px;color:var(--red-600);font-weight:600;">${a.deadline}</td>
 <td><a class="btn btn-primary btn-sm" href="${wsUrl(a.id)}&tab=supplement">Bổ sung ngay</a></td></tr>`).join('');

// 4. Summary cards
const cards=[
 ['Chờ thẩm định',counts.PENDING_UW,'UW'],['Đang thẩm định',counts.IN_UW,'UW'],
 ['Chờ khách xác nhận',counts.CONFIRM,'CONFIRM'],['Chờ thanh toán',counts.PAYMENT,'PAYMENT'],
 ['Đã thanh toán / chờ phát hành',counts.PAID,'ISSUE']
];
const cardHtml=`<div class="kpi-row" style="grid-template-columns:repeat(5,1fr);">${cards.map(([l,n,g])=>`<div class="card" style="margin:0;cursor:pointer;text-align:center;padding:14px 8px;" onclick="location.href='${r}modules/submitted-applications/index.html?group=${g}'"><div style="font-size:24px;font-weight:700;color:var(--brand-600);">${n}</div><div style="font-size:11.5px;color:var(--ink-500);margin-top:4px;">${l}</div></div>`).join('')}</div>`;

// 6. Notifications
const notiHtml = notis.length? notis.map(n=>{
 const icon={UW:'📋',SUPPLEMENT:'⚠️',POLICY:'📄',QUOTE:'⏳',RENEWAL:'🔄',LICENSE:'🪪',PAYMENT:'💳',REFERRAL:'📨',SLA:'🚨',TEAM:'👥',PERF:'📈'}[n.type]||'🔔';
 return `<div class="activity-item" style="display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);"><div>${icon}</div><div style="flex:1;"><div style="font-size:12.5px;color:var(--ink-700);">${n.text}</div><div style="font-size:11px;color:var(--ink-300);">${n.at}</div></div></div>`;
}).join('') : '<div class="empty-state">Không có thông báo mới.</div>';

// 7. KPI
const kpiHtml=`<div class="kpi-strip light">
 <div class="kpi"><span>Premium tháng này</span><b>${BANCA.vnd(kpi.premium)}</b></div>
 ${showCommission?`<div class="kpi" style="cursor:pointer;" onclick="location.href='${r}modules/policies/index.html?commission=mine'"><span>Hoa hồng dự kiến tháng này<span class="help-hint" tabindex="0" title="Ước tính hoa hồng cộng dồn (accrued) cho các yêu cầu đã phát hành trong tháng. Số chính thức phụ thuộc đối soát và có thể bị thu hồi (clawback) nếu hủy hợp đồng trong thời gian cân nhắc.">?</span></span><b>${BANCA.vnd(commission.amount)}</b><div style="font-size:12px;color:var(--ink-500);margin-top:2px;">${commission.count} yêu cầu · accrued</div></div>`:''}
 <div class="kpi"><span>Đã phát hành</span><b>${kpi.policies}</b></div>
 <div class="kpi"><span>Tỷ lệ chuyển đổi</span><b>${kpi.conversion}</b></div>
 <div class="kpi"><span>Tiến độ chỉ tiêu</span><b>${kpi.target}</b></div>
</div>`;

// ===== Bàn giao mới (Sales Handoff / Case Reassignment / Delegation) =====
function handoffInbox(){
  const list = BANCA.handoffsForSeller ? BANCA.handoffsForSeller(me) : [];
  if(!list.length) return `<div class="section-title"><h2>Bàn giao mới</h2></div><div class="card" style="padding:12px 14px;font-size:12.5px;color:var(--ink-500);">Không có bàn giao mới.</div>`;
  const badge = t => t==='SALES_HANDOFF'?'<span class="badge badge-ready" style="font-size:10px;">Tạo yêu cầu bảo hiểm từ tư vấn này</span>':t==='CASE_REASSIGNMENT'?'<span class="badge badge-conditional" style="font-size:10px;">Chuyển phụ trách</span>':'<span class="badge badge-version" style="font-size:10px;">Công việc hỗ trợ</span>';
  const cta = t => t==='SALES_HANDOFF'?'Tiếp nhận & bán hàng':t==='CASE_REASSIGNMENT'?'Tiếp nhận & xử lý':'Bắt đầu công việc';
  const srcBadge = h => `<span class="badge badge-version" style="font-size:9px;" title="${h.sourceSystem||''}">${h.source==='BANK_CRM'?'Bank CRM':h.source==='REFERRAL'?'Lead/Referral':'Portal'}</span>`;
  const card = h => `<div class="card" style="padding:14px 16px;margin-bottom:10px;border-left:4px solid ${h.type==='SALES_HANDOFF'?'var(--teal-600)':h.type==='CASE_REASSIGNMENT'?'var(--amber-600)':'var(--brand-600)'};">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;">
      <div><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">${badge(h.type)} ${srcBadge(h)} ${h.priority==='HIGH'?'<span class="badge badge-blocked" style="font-size:9px;">Ưu tiên cao</span>':''}</div>
        <div style="font-weight:700;font-size:14px;margin-top:6px;">${h.customerName}${h.cif?' · CIF '+h.cif:''}</div>
        <div style="font-size:12.5px;color:var(--ink-500);">${h.productName||''}${h.packageName?' · '+h.packageName:''}${h.needSummary?' · '+h.needSummary:''}</div>
      </div>
      <div style="text-align:right;font-size:11.5px;color:var(--ink-500);">SLA bàn giao · hạn tiếp nhận<br><b style="color:var(--ink-700);">${h.acceptBy||'—'}</b><div style="font-size:10px;color:var(--ink-300);">SLA yêu cầu tính sau khi tiếp nhận</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:11.5px;color:var(--ink-500);margin-top:8px;">
      ${h.type!=='DELEGATION'?`<div>Người giới thiệu: <b>${BANCA.participantName(h,'REFERRER')||'—'}</b></div><div>Người tư vấn: <b>${BANCA.participantName(h,'ADVISOR')||'—'}</b></div>`:''}
      <div>Người phân công: <b>${BANCA.participantName(h,'ASSIGNMENT_ACTOR')||'—'}</b></div>
      ${h.completeness!=null?`<div>Đã hoàn thành: <b>${h.completeness}%</b></div>`:''}
    </div>
    ${h.recommendationReason||h.taskNote?`<div style="font-size:12px;color:var(--ink-600);margin-top:6px;">${h.recommendationReason||h.taskNote}</div>`:''}
    ${h.state==='NEED_MORE_INFORMATION'?`<div class="card" style="padding:8px 10px;background:#fff6e6;border-color:#ffe0a3;font-size:12px;color:#8a5a00;margin-top:8px;">⏳ Đã yêu cầu bổ sung: ${h.infoRequest||''} — chờ người tư vấn/phân công phản hồi.</div>`:''}
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" onclick="hoAccept('${h.id}')">${cta(h.type)}</button>
      ${h.state!=='NEED_MORE_INFORMATION'?`<button class="btn btn-secondary btn-sm" onclick="hoNeedInfo('${h.id}')">Cần bổ sung</button>`:''}
      <button class="btn btn-secondary btn-sm" onclick="hoDecline('${h.id}')">Từ chối</button>
      <button class="btn btn-secondary btn-sm" onclick="hoReview('${h.id}')">Xem khách hàng</button>
    </div>
  </div>`;
  return `<div class="section-title"><h2>Bàn giao mới</h2><span class="subtitle">${list.length} bàn giao chờ tiếp nhận · nhân viên tư vấn chỉ review khách hàng, không chọn lại</span></div>${list.map(card).join('')}`;
}
window.hoModal=(html)=>{ let el=document.getElementById('ho-modal'); if(!el){el=document.createElement('div');el.id='ho-modal';document.body.appendChild(el);} el.innerHTML=`<div class="modal-overlay2 open" onclick="if(event.target===this)hoClose()"><div class="modal2" style="max-width:480px;" onclick="event.stopPropagation()">${html}</div></div>`; };
window.hoClose=()=>{ const el=document.getElementById('ho-modal'); if(el)el.innerHTML=''; };
window.hoToast=(m)=>{ const t=document.createElement('div'); t.textContent=m; t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:9999;'; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); };
window.hoReview=(id)=>{ const h=BANCA.handoffById(id); hoModal(`<div class="modal2-head"><b>Khách hàng · chỉ review</b><span class="modal2-close" onclick="hoClose()">&times;</span></div><div class="modal2-body"><div style="font-size:12px;color:var(--ink-500);margin-bottom:8px;">Nhân viên tư vấn không chọn lại khách khi tiếp nhận — chỉ xem ngữ cảnh, nguồn, consent.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:12.5px;"><div>Khách: <b>${h.customerName}</b></div><div>CIF: ${h.cif||'—'}</div><div>Nguồn: ${h.sourceSystem||h.source}</div><div>Lead: ${h.leadRef||'—'}</div><div>Sản phẩm: ${h.productName||'—'}</div><div>Consent: ${h.consent==='VALID'?'<span class="badge badge-ready" style="font-size:9px;">Hợp lệ</span>':'<span class="badge badge-conditional" style="font-size:9px;">Chờ</span>'}</div></div><div style="border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;font-size:11.5px;color:var(--ink-300);">Ngoại lệ: nếu sai khách/CIF/duplicate — <a href="#" onclick="hoChangeCust('${id}');return false;" style="color:var(--amber-600);">Yêu cầu điều chỉnh khách hàng</a> (revalidate + có thể re-rating).</div><div style="display:flex;justify-content:flex-end;margin-top:10px;"><button class="btn btn-secondary btn-sm" onclick="hoClose()">Đóng</button></div></div>`); };
window.hoChangeCust=(id)=>{ const opts=(BANCA.myCustomers?BANCA.myCustomers():[]).filter(c=>c.scope[me]!=='PROSPECT').slice(0,8); hoModal(`<div class="modal2-head"><b>Yêu cầu điều chỉnh khách hàng (ngoại lệ)</b><span class="modal2-close" onclick="hoClose()">&times;</span></div><div class="modal2-body"><div class="card" style="padding:8px 10px;background:#fff6e6;border-color:#ffe0a3;font-size:11.5px;color:#8a5a00;margin-bottom:10px;">Đổi khách sẽ revalidate consent/portfolio/eligibility/quote. Quote KH cũ KHÔNG giữ cho KH mới (re-rating). Nếu nhân viên tư vấn không còn hợp lệ → về hàng chờ phân công.</div><div class="label" style="margin-bottom:6px;">Khách hàng đúng</div><select id="ho-newcust" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;margin-bottom:8px;">${opts.map(c=>`<option value="${c.id}">${c.name} · CIF ${c.cif||'—'}</option>`).join('')}</select><div class="label" style="margin-bottom:6px;">Lý do (bắt buộc)</div><input id="ho-cust-reason" placeholder="Chọn sai / duplicate / sai CIF / integration lỗi" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;"><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;"><button class="btn btn-secondary btn-sm" onclick="hoClose()">Huỷ</button><button class="btn btn-primary btn-sm" onclick="hoDoChangeCust('${id}')">Xác nhận</button></div></div>`); };
window.hoDoChangeCust=(id)=>{ const cid=document.getElementById('ho-newcust').value; const reason=(document.getElementById('ho-cust-reason').value||'').trim(); if(!reason)return hoToast('Nhập lý do.'); const c=BANCA.customerById(cid)||{}; const res=BANCA.changeCustomer(id,cid,c.name,reason,me); hoClose(); hoToast(res&&res.invalidated?'Đã đổi khách — assignment vô hiệu, về hàng chờ. Quote cần re-rating.':'Đã đổi khách — quote cần re-rating.'); setTimeout(()=>location.reload(),900); };
window.hoAccept=(id)=>{ const h=BANCA.handoffById(id); BANCA.acceptHandoff(id, me); hoClose();
  hoToast(h.type==='SALES_HANDOFF'?'Đã tiếp nhận — mở phiên bán hàng.':h.type==='CASE_REASSIGNMENT'?'Đã tiếp nhận hồ sơ.':'Đã bắt đầu công việc hỗ trợ.');
  setTimeout(()=>{ if(h.type==='DELEGATION'){ location.href=r+'modules/application-workspace/index.html?id='+(h.caseId||''); }
    else if(h.type==='CASE_REASSIGNMENT'){ location.href=r+'modules/application-workspace/index.html?id='+(h.caseId||''); }
    else { location.href=r+'modules/application-workspace/index.html?entry=CONVERTED_FROM_ADVICE&adviceId='+(h.adviceId||'')+'&handoff='+id; } }, 700); };
window.hoDecline=(id)=>{ hoModal(`<div class="modal2-head"><b>Từ chối bàn giao</b><span class="modal2-close" onclick="hoClose()">&times;</span></div><div class="modal2-body"><div class="label" style="margin-bottom:6px;">Lý do (bắt buộc)</div><select id="ho-reason" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;">${(BANCA.DECLINE_REASONS||[]).map(x=>`<option>${x}</option>`).join('')}</select><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;"><button class="btn btn-secondary btn-sm" onclick="hoClose()">Huỷ</button><button class="btn btn-primary btn-sm" onclick="hoDoDecline('${id}')">Xác nhận từ chối</button></div></div>`); };
window.hoDoDecline=(id)=>{ const reason=document.getElementById('ho-reason').value; BANCA.declineHandoff(id, reason, me); hoClose(); hoToast('Đã từ chối — trả lại hàng chờ với lý do.'); setTimeout(()=>location.reload(),700); };
window.hoNeedInfo=(id)=>{ hoModal(`<div class="modal2-head"><b>Yêu cầu bổ sung thông tin</b><span class="modal2-close" onclick="hoClose()">&times;</span></div><div class="modal2-body"><div style="font-size:12px;color:var(--ink-500);margin-bottom:6px;">Nộp yêu cầu bảo hiểm cho người tư vấn/phân công — bàn giao chuyển "Cần bổ sung", chưa tiếp nhận.</div><textarea id="ho-info" placeholder="Cần bổ sung gì? (chứng từ, thông tin khách...)" style="width:100%;min-height:60px;padding:8px;border:1px solid var(--line);border-radius:7px;font-size:13px;"></textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;"><button class="btn btn-secondary btn-sm" onclick="hoClose()">Huỷ</button><button class="btn btn-primary btn-sm" onclick="hoDoNeedInfo('${id}')">Nộp yêu cầu bảo hiểm</button></div></div>`); };
window.hoDoNeedInfo=(id)=>{ const note=(document.getElementById('ho-info').value||'').trim(); if(!note)return hoToast('Nhập nội dung cần bổ sung.'); BANCA.needMoreInfo(id,note,me); hoClose(); hoToast('Đã gửi yêu cầu bổ sung.'); setTimeout(()=>location.reload(),700); };

// ===== P0: "Việc cần làm ngay" — action queue gộp mọi việc có SLA/blocker theo 1 thứ tự =====
const NOW_TS = new Date('2026-07-22T16:47:00+07:00').getTime();
function relDue(due){
  if(!due) return {label:'Chưa có hạn', tone:'var(--ink-300)', order:9e15};
  const s=String(due).trim(); const t=new Date(s.replace(' ','T')+(s.length<=10?'T23:59:59':'')+'+07:00').getTime();
  if(isNaN(t)) return {label:s, tone:'var(--ink-500)', order:8e15};
  const diff=t-NOW_TS; const m=Math.round(Math.abs(diff)/60000);
  const human=mm=>{ if(mm<60)return mm+' phút'; const h=Math.round(mm/60); if(h<24)return h+' giờ'; return Math.round(h/24)+' ngày'; };
  if(diff<0) return {label:'Quá hạn '+human(m), tone:'var(--red-600)', order:diff, overdue:true};
  if(m<=180) return {label:'Còn '+human(m), tone:'var(--amber-600)', order:diff};
  return {label:'Còn '+human(m), tone:'var(--ink-500)', order:diff};
}
const SEVQ={HIGH:['Cao','#fdecec','var(--red-600)'],MED:['TB','#fff6e6','var(--amber-600)'],LOW:['Thấp','#eef4ff','var(--brand-600)']};
function collectActionItems(){
  const items=[];
  // 1) Bàn giao chờ tiếp nhận
  (BANCA.handoffsForSeller?BANCA.handoffsForSeller(me):[]).forEach(h=>{
    items.push({sev:h.priority==='HIGH'?'HIGH':'MED', kind:'Bàn giao chờ tiếp nhận', cust:h.customerName, sub:h.productName||BANCA.handoffTypeLabel(h.type),
      id:h.id, due:h.acceptBy, ctaHtml:`<button class="btn btn-primary btn-sm" onclick="hoAccept('${h.id}')">Tiếp nhận</button>`});
  });
  // 2) Yêu cầu cần bổ sung (sau nộp)
  needMore.forEach(a=>{ items.push({sev:'HIGH', kind:'Yêu cầu cần bổ sung', cust:custName(a.customerId), sub:(a.supplement&&a.supplement.items?a.supplement.items.join('; '):''),
    id:a.id, due:a.deadline, ctaHtml:`<a class="btn btn-primary btn-sm" href="${wsUrl(a.id)}&tab=supplement">Bổ sung</a>`}); });
  // 3) Báo giá sắp/đã hết hạn (nháp)
  drafts.filter(a=>{ if((a.warnings||[]).some(w=>['QUOTE_EXPIRING','QUOTE_NEED_RERATE'].includes(w)))return true; const st=a.quote?BANCA.quoteStatus(a.quote,null):null; return st==='EXPIRED'||st==='EXPIRING_SOON'; })
    .forEach(a=>{ items.push({sev:'MED', kind:'Báo giá sắp hết hạn', cust:custName(a.customerId), sub:a.quote?(a.quote.id+' v'+a.quote.version):'', id:a.id, due:a.quote?a.quote.validUntil:null,
      ctaHtml:`<a class="btn btn-primary btn-sm" href="${wsUrl(a.id)}&step=PACKAGE_AND_QUOTE">Tính phí lại</a>`}); });
  // 4) Yêu cầu có thể nộp hôm nay (đã tới bước review, không có warning chặn)
  drafts.filter(a=>(a.currentStage==='REVIEW_AND_SUBMIT'||a.progress>=100) && !(a.warnings||[]).some(w=>['MISSING_INFORMATION','MISSING_DOCUMENT','QUOTE_NEED_RERATE','CANNOT_SUBMIT'].includes(w)))
    .forEach(a=>{ items.push({sev:'LOW', kind:'Yêu cầu có thể nộp', cust:custName(a.customerId), sub:a.productName||'', id:a.id, due:null,
      ctaHtml:`<a class="btn btn-primary btn-sm" href="${wsUrl(a.id)}&step=REVIEW_AND_SUBMIT">Kiểm tra & nộp</a>`}); });
  const rank={HIGH:0,MED:1,LOW:2};
  return items.map(it=>({...it, rt:relDue(it.due)})).sort((a,b)=>{ const ao=a.rt.overdue?0:1,bo=b.rt.overdue?0:1; if(ao!==bo)return ao-bo; if(rank[a.sev]!==rank[b.sev])return rank[a.sev]-rank[b.sev]; return a.rt.order-b.rt.order; });
}
function actionQueueBlock(){
  const items=collectActionItems();
  const cnt=k=>items.filter(i=>i.kind===k).length;
  // Summary hành động (thay lời chào + thống kê khô)
  const chips=[];
  const ho=cnt('Bàn giao chờ tiếp nhận'); if(ho) chips.push(['💬',ho+' bàn giao chờ tiếp nhận','var(--brand-600)']);
  const sup=cnt('Yêu cầu cần bổ sung'); if(sup) chips.push(['🚨',sup+' yêu cầu cần bổ sung','var(--red-600)']);
  const q=cnt('Báo giá sắp hết hạn'); if(q) chips.push(['⏳',q+' báo giá sắp hết hạn','var(--amber-600)']);
  const sb=cnt('Yêu cầu có thể nộp'); if(sb) chips.push(['✅',sb+' yêu cầu có thể nộp','var(--teal-600)']);
  const summary = chips.length
    ? `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">${chips.map(([ic,t,c])=>`<span style="display:inline-flex;align-items:center;gap:6px;background:var(--paper-card);border:1px solid var(--line);border-left:3px solid ${c};border-radius:8px;padding:7px 12px;font-size:12.5px;color:var(--ink-700);"><span>${ic}</span>${t}</span>`).join('')}</div>`
    : `<div style="margin-bottom:12px;font-size:13px;color:var(--teal-600);">✓ Không có việc gấp — bạn đã xử lý hết hàng chờ hôm nay. 🎉</div>`;
  const rows=items.slice(0,8).map(it=>{ const s=SEVQ[it.sev]; const isApp=/^(APP|DRAFT)/.test(it.id||'');
    return `<tr>
      <td><span class="badge" style="background:${s[1]};color:${s[2]};">${s[0]}</span></td>
      <td style="font-size:12px;color:${it.rt.tone};font-weight:600;">${it.rt.label}</td>
      <td style="font-size:12.5px;">${it.cust||'—'}</td>
      <td style="font-size:12.5px;"><b>${it.kind}</b>${it.sub?`<div style="font-size:11px;color:var(--ink-300);">${it.sub}</div>`:''}</td>
      <td>${isApp?`<a href="${wsUrl(it.id)}" style="font-size:12px;color:var(--brand-600);font-weight:600;">${it.id}</a>`:`<span style="font-size:12px;color:var(--ink-500);">${it.id||'—'}</span>`}</td>
      <td>${it.ctaHtml}</td>
    </tr>`; }).join('');
  const table = items.length
    ? `<div class="card" style="padding:0;overflow-x:auto;"><table class="dtable"><thead><tr><th>Ưu tiên</th><th>Hạn / SLA</th><th>Khách hàng</th><th>Việc</th><th>Yêu cầu</th><th>Hành động</th></tr></thead><tbody>${rows}</tbody></table></div>${items.length>8?`<div style="font-size:12px;color:var(--ink-500);margin-top:6px;">+ ${items.length-8} việc khác — xem trong Yêu cầu bảo hiểm chưa nộp / đã nộp.</div>`:''}`
    : '';
  return `${summary}<div class="section-title"><h2>Việc cần làm ngay</h2><span class="subtitle">Gộp mọi việc có SLA hoặc ảnh hưởng phát hành · xử lý từ trên xuống</span></div>${table}`;
}

shell('Trang chủ','Hôm nay tôi cần làm gì?',
homeScopeTabs+`
<section class="home-head">
 <div class="home-head-id">
  <div class="h1" style="margin:0 0 2px;">Xin chào ${p.name}</div>
  <div class="subtitle">${p.role} · ${p.branch||p.partner||''}${p.team?' · '+p.team:''} · ${drafts.length} yêu cầu chưa nộp · ${needMore.length} cần bổ sung · ${submitted.length} đang xử lý</div>
 </div>
</section>

${actionQueueBlock()}

${handoffInbox()}

<div class="section-title"><h2>Yêu cầu bảo hiểm chưa nộp gần đây</h2><a href="${r}modules/unsubmitted-applications/index.html" style="font-size:12.5px;color:var(--brand-600);">Xem tất cả (${drafts.length}) →</a></div>
${drafts.length?`<div class="card" style="padding:0;"><table class="dtable"><thead><tr><th>Mã yêu cầu</th><th>Khách hàng</th><th>Sản phẩm</th><th>Bước hiện tại</th><th>Hoàn thành</th><th>Cảnh báo</th><th>Cập nhật</th><th></th></tr></thead><tbody>${draftRows}</tbody></table></div>`:`<div class="card"><div class="empty-state">Chưa có yêu cầu nháp. Bấm "Tạo yêu cầu bảo hiểm" để tạo yêu cầu đầu tiên.</div></div>`}

<div class="section-title"><h2>Trạng thái xử lý yêu cầu đã nộp</h2><span class="subtitle">Click để xem danh sách theo trạng thái</span></div>
${cardHtml}

<div class="section-title"><h2>Hiệu suất cá nhân</h2><span class="subtitle">Tháng này · sync ${BANCA.partnerConfig.syncAt}</span></div>
${kpiHtml}

<div class="layout-2col" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;align-items:stretch;">
 <div style="display:flex;flex-direction:column;min-height:0;">
  <div class="section-title"><h2>Hợp đồng</h2><a href="${r}modules/policies/index.html" style="font-size:12.5px;color:var(--brand-600);">Xem tất cả →</a></div>
  <div class="card" style="flex:1;max-height:340px;overflow-y:auto;">
   <div class="label">Mới phát hành</div>
   ${newPols.length? newPols.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);"><div><a href="${r}modules/policies/index.html?view=detail&id=${x.id}" style="font-weight:600;font-size:13px;color:var(--brand-600);">${x.id}</a><div style="font-size:11.5px;color:var(--ink-500);">${custName(x.customerId)} · ${x.vehicle?(x.vehicle.brand+' '+x.vehicle.model):(x.productName||x.package||'')}</div></div><span class="badge badge-ready">Mới</span></div>`).join(''):'<div style="font-size:12px;color:var(--ink-300);padding:6px 0;">Không có</div>'}
   <div class="label" style="margin-top:12px;">Sắp tái tục</div>
   ${renewals.length? renewals.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);"><div><a href="${r}modules/policies/index.html?view=detail&id=${x.id}" style="font-weight:600;font-size:13px;color:var(--brand-600);">${x.id}</a><div style="font-size:11.5px;color:var(--ink-500);">${custName(x.customerId)} · hết hạn ${x.effectiveTo}</div></div><span class="badge badge-conditional">Tái tục</span></div>`).join(''):'<div style="font-size:12px;color:var(--ink-300);padding:6px 0;">Không có</div>'}
  </div>
 </div>
 <div style="display:flex;flex-direction:column;min-height:0;">
  <div class="section-title"><h2>Thông báo</h2></div>
  <div class="card" style="flex:1;max-height:340px;overflow-y:auto;">${notiHtml}</div>
 </div>
</div>


`);
}
</script></body></html>
