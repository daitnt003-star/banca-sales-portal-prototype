<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trợ giúp — Banca Sales Portal</title><script src="../../shared/js/head-loader.js?v=43"></script></head><body><script>
const faqs=[
 ['Hồ sơ "chưa nộp" và "đã nộp" khác nhau thế nào?','Hồ sơ chưa nộp (NOT_SUBMITTED) đang trong hành trình lập hồ sơ — lọc theo bước (7 bước chuẩn hóa). Hồ sơ đã nộp (SUBMITTED) đang được xử lý — lọc theo trạng thái lifecycle. Cờ cảnh báo (thiếu thông tin, thiếu tài liệu…) là badge, không phải trạng thái.'],
 ['Vì sao tôi không bấm được "Nộp hồ sơ"?','Kiểm tra: các bước bắt buộc đã hoàn thành, đủ tài liệu, báo giá còn hiệu lực (chưa hết hạn), sản phẩm còn READY với bạn, và đã tick đủ 2 ô xác nhận.'],
 ['Báo giá hết hạn thì làm gì?','Mở hồ sơ → bước "Gói bảo hiểm & báo giá" → bấm "Tính phí lại". Version cũ được lưu trong lịch sử báo giá.'],
 ['Tôi là Team Leader, sửa hồ sơ của seller được không?','Không. Manager xem case trong scope, giao task, delegation, reassign — nhưng không sửa nội dung hồ sơ của seller, không sửa hierarchy hay quyền sản phẩm.'],
 ['Khách cần bổ sung tài liệu, thao tác ở đâu?','Trang chủ mục "Hồ sơ cần bổ sung" hoặc Hồ sơ đã nộp → filter "Cần bổ sung" → CTA "Bổ sung hồ sơ". Chỉ mục được UW yêu cầu mới mở để sửa.'],
 ['Sao tôi không thấy sản phẩm Health?','Quyền bán theo readiness: kiểm tra Hồ sơ nhân viên → tab Sản phẩm bán hàng để xem trạng thái READY/CONDITIONAL/BLOCKED và chứng chỉ còn thiếu.']
];
shell('Trợ giúp','Trợ giúp',`
<div class="section-title"><h2>Câu hỏi thường gặp</h2></div>
${faqs.map(([q,a])=>`<div class="card" style="padding:14px 16px;margin-bottom:10px;"><div style="font-weight:600;font-size:13.5px;color:var(--ink-900);">${q}</div><div style="font-size:12.5px;color:var(--ink-500);margin-top:6px;">${a}</div></div>`).join('')}
<div class="section-title"><h2>Liên hệ hỗ trợ</h2></div>
<div class="card" style="padding:16px;font-size:13px;">
 <div>📞 Hotline nghiệp vụ Banca: <b>1900 1234</b> (8:00–17:30)</div>
 <div style="margin-top:6px;">✉️ Email: <b>banca-support@fpt-is.example</b></div>
 <div style="margin-top:6px;">🛠 Sự cố hệ thống: IT Helpdesk ext. 1800</div>
</div>
`,{startSale:false});
</script></body></html>
