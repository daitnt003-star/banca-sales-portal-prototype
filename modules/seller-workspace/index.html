<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trang chủ — Banca Sales Portal</title><script src="../../shared/js/head-loader.js?v=44"></script></head><body><script>
const p = BANCA.persona();
const me = BANCA.current();
const r = rel();

if(p.status!=='ACTIVE'){
 const _inDate=p.inactiveSince?(String(p.inactiveSince).match(/(\d{4})-(\d{2})-(\d{2})/)?RegExp.$3+'/'+RegExp.$2+'/'+RegExp.$1:p.inactiveSince):'';
 shell('Trang chủ','Tài khoản ngừng hoạt động',`<div class="card"><div class="alert2 danger"><b>Tài khoản của bạn đã ngừng hoạt động${_inDate?' từ '+_inDate:''}.</b><br>Mọi chức năng bán hàng bị khóa. Vui lòng liên hệ bộ phận quản trị kênh phân phối để được hỗ trợ.</div></div>`,{startSale:false});
} else if(p.serviceError){
 // Lỗi hệ thống xác thực điều kiện bán (readiness service không phản hồi) → chặn an toàn (default deny).
 shell('Trang chủ','Không xác thực được điều kiện bán hàng',`<div class="card"><div class="alert2 danger"><b>Chưa thể xác thực điều kiện bán hàng của bạn.</b><br>Hệ thống tạm thời không kết nối được tới dịch vụ kiểm tra quyền bán / chứng chỉ. Để đảm bảo an toàn, các thao tác bán hàng tạm khóa cho tới khi kết nối được khôi phục.</div>
   <div style="margin-top:12px;font-size:13px;color:var(--ink-600);">Bạn có thể:</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;"><button class="btn btn-primary btn-sm" onclick="location.reload()">Thử lại</button><a class="btn btn-secondary btn-sm" href="${r}modules/help/index.html">Liên hệ hỗ trợ</a></div>
   <div style="font-size:11px;color:var(--ink-300);margin-top:12px;">Nếu tình trạng kéo dài, vui lòng báo bộ phận quản trị kênh phân phối để kiểm tra đồng bộ dữ liệu.</div>
 </div>`,{startSale:false});
} else if(BANCA.isManagerProfile(me) && !BANCA.resolveManagerProfile(me).sellingEnabled){
 // Manager chỉ quản lý → Trang chủ CHÍNH LÀ Manager Cockpit (không hiển thị dashboard cá nhân).
 location.replace(r+'modules/team-workspace/index.html');
} else {

// Player-coach (vừa bán vừa quản lý): Trang chủ có scope tab [Cá nhân][Quản lý] ngay trên đầu.
const _mgr = BANCA.isManagerProfile(me);
const homeScopeTabs = _mgr
 ? BANCA.ui.tabBar([{id:'self',label:'Cá nhân'},{id:'manage',label:'Quản lý',href:r+'modules/team-workspace/index.html'}], 'self', {variant:'pill'})
 : '';

// Dữ liệu
const drafts = BANCA.myApps('NOT_SUBMITTED').filter(a=>a.owner===me).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));
const submitted = BANCA.myApps('SUBMITTED').filter(a=>a.owner===me);
const needMore = submitted.filter(a=>a.status==='NEED_MORE_INFO');
const counts = {
 PENDING_UW: submitted.filter(a=>['PENDING_RECEIPT','PENDING_UW'].includes(a.status)).length,
 IN_UW: submitted.filter(a=>a.status==='IN_UW').length,
 CONFIRM: submitted.filter(a=>['UW_DECIDED','PENDING_CUSTOMER_CONFIRM'].includes(a.status)).length,
 PAYMENT: submitted.filter(a=>a.status==='PENDING_PAYMENT').length,
 PAID: submitted.filter(a=>['PAID','PENDING_ISSUE'].includes(a.status)).length
};
const pols = BANCA.myPolicies().filter(x=>x.owner===me);
const newPols = pols.filter(x=>x.isNew);
const renewals = pols.filter(x=>x.renewalStatus==='RENEWAL_DUE');
const notis = BANCA.notifications[me]||[];
const kpi = BANCA.kpi[me]||{premium:0,policies:0,conversion:'—',target:'—'};
const commission = BANCA.commissionSummary(me);
const showCommission = BANCA.commissionVisible('home');

const wsUrl = id => r+'modules/application-workspace/index.html?id='+id;

// §corrective §1 — Privacy guard cho Trang chủ.
// Kênh ẩn danh (Banca tích hợp: showCustomerList=false) → KHÔNG lộ tên/CIF/PII khách,
// KHÔNG chọn/đổi khách; work item chỉ hiện case/external ref + ngữ cảnh nghiệp vụ.
// Agent/Broker/Standalone (showCustomerList=true) giữ nguyên UI khách hàng (regression-safe).
const showCustomer = BANCA.channelShowsCustomerList();
const custLabelHdr = showCustomer ? 'Khách hàng' : 'Tham chiếu';
const anonAppRef = a => (a && (a.externalCustomerRef || a.customerRef || a.id)) || '—';
const custCell = a => showCustomer ? custName(a.customerId) : ('🔒 '+anonAppRef(a)+' · <i style="color:var(--ink-300);">định danh chưa chia sẻ</i>');
const anonHandoffRef = h => (h && (h.externalCustomerRef || h.leadRef || h.id)) || '—';

// 2. Bản chào chưa nộp gần đây (max 5)
const draftRows = drafts.slice(0,5).map(a=>`<tr>
 <td><a href="${wsUrl(a.id)}" style="font-weight:600;color:var(--brand-600);">${a.id}</a></td>
 <td>${custCell(a)}</td><td style="font-size:12px;">${a.productName}</td>
 <td style="font-size:12px;">${BANCA.stageLabel(a.currentStage)}</td>
 <td><div class="progress" style="width:70px;height:6px;background:var(--line);border-radius:4px;"><div style="width:${a.progress}%;height:6px;background:var(--brand-600);border-radius:4px;"></div></div><span style="font-size:11px;color:var(--ink-500);">${a.progress}%</span></td>
 <td>${warnBadges(a.warnings)||'<span style="color:var(--ink-300);font-size:11px;">—</span>'}</td>
 <td style="font-size:11px;color:var(--ink-500);">${a.updatedAt}</td>
 <td class="table-action-cell"><div class="table-action-stack"><a class="btn btn-primary btn-sm" href="${wsUrl(a.id)}">Tiếp tục</a></div></td></tr>`).join('');

// 3. Bản chào cần bổ sung
const needRows = needMore.map(a=>`<tr>
 <td><a href="${wsUrl(a.id)}" style="font-weight:600;color:var(--brand-600);">${a.id}</a></td>
 <td>${custCell(a)}</td>
 <td><span class="chip">${a.supplement.type==='DOCUMENT'?'Tài liệu':'Thông tin'}</span></td>
 <td style="font-size:12px;">${a.supplement.items.join('; ')}</td>
 <td style="font-size:12px;color:var(--red-600);font-weight:600;">${a.deadline}</td>
 <td class="table-action-cell"><div class="table-action-stack"><a class="btn btn-primary btn-sm" href="${wsUrl(a.id)}&tab=supplement">Bổ sung ngay</a></div></td></tr>`).join('');

// 4. Summary cards
const cards=[
 ['Chờ thẩm định',counts.PENDING_UW,'UW'],['Đang thẩm định',counts.IN_UW,'UW'],
 ['Chờ khách xác nhận',counts.CONFIRM,'CONFIRM'],['Chờ thanh toán',counts.PAYMENT,'PAYMENT'],
 ['Đã thanh toán / chờ phát hành',counts.PAID,'ISSUE']
];
const cardHtml=`<div class="kpi-row" style="grid-template-columns:repeat(5,1fr);">${cards.map(([l,n,g])=>`<div class="card" style="margin:0;cursor:pointer;text-align:center;padding:14px 8px;" onclick="location.href='${r}modules/submitted-applications/index.html?group=${g}'"><div style="font-size:24px;font-weight:700;color:var(--brand-600);">${n}</div><div style="font-size:11px;color:var(--ink-500);margin-top:4px;">${l}</div></div>`).join('')}</div>`;

// 6. Notifications
const notiHtml = notis.length? notis.map(n=>{
 const icon={UW:'📋',SUPPLEMENT:'⚠️',POLICY:'📄',QUOTE:'⏳',RENEWAL:'🔄',LICENSE:'🪪',PAYMENT:'💳',REFERRAL:'📨',SLA:'🚨',TEAM:'👥',PERF:'📈'}[n.type]||'🔔';
 return `<div class="activity-item" style="display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);"><div>${icon}</div><div style="flex:1;"><div style="font-size:12px;color:var(--ink-700);">${n.text}</div><div style="font-size:11px;color:var(--ink-300);">${n.at}</div></div></div>`;
}).join('') : '<div class="empty-state">Không có thông báo mới.</div>';

// 7. KPI
const kpiHtml=`<div class="kpi-strip light">
 <div class="kpi"><span>Premium tháng này</span><b>${BANCA.vnd(kpi.premium)}</b></div>
 ${showCommission?`<div class="kpi" style="cursor:pointer;" onclick="location.href='${r}modules/policies/index.html?commission=mine'"><span>Hoa hồng dự kiến tháng này<span class="help-hint" tabindex="0" title="Ước tính hoa hồng cộng dồn (accrued) cho các bản chào đã phát hành trong tháng. Số chính thức phụ thuộc đối soát và có thể bị thu hồi (clawback) nếu hủy hợp đồng trong thời gian cân nhắc.">?</span></span><b>${BANCA.vnd(commission.amount)}</b><div style="font-size:12px;color:var(--ink-500);margin-top:2px;">${commission.count} bản chào · accrued</div></div>`:''}
 <div class="kpi"><span>Đã phát hành</span><b>${kpi.policies}</b></div>
 <div class="kpi"><span>Tỷ lệ chuyển đổi</span><b>${kpi.conversion}</b></div>
 <div class="kpi"><span>Tiến độ chỉ tiêu</span><b>${kpi.target}</b></div>
</div>`;

// Modal và handler bàn giao hiện hữu được giữ nguyên; Work Queue chỉ gọi lại các hàm này.
window.hoModal=(html)=>{ let el=document.getElementById('ho-modal'); if(!el){el=document.createElement('div');el.id='ho-modal';document.body.appendChild(el);} el.innerHTML=`<div class="modal-overlay2 open" onclick="if(event.target===this)hoClose()"><div class="modal2" style="max-width:480px;" onclick="event.stopPropagation()">${html}</div></div>`; };
window.hoClose=()=>{ const el=document.getElementById('ho-modal'); if(el)el.innerHTML=''; };
window.hoToast=(m)=>{ const t=document.createElement('div'); t.textContent=m; t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:9999;'; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); };
window.hoReview=(id)=>{ const h=BANCA.handoffById(id);
  // Kênh ẩn danh: chỉ xem external ref + ngữ cảnh nghiệp vụ, KHÔNG tên/CIF, KHÔNG đổi khách.
  const idRows = showCustomer
    ? `<div>Khách: <b>${h.customerName}</b></div><div>CIF: ${h.cif||'—'}</div>`
    : `<div>Tham chiếu: <b>🔒 ${anonHandoffRef(h)}</b></div><div>Định danh: <i>chưa chia sẻ</i></div>`;
  const exceptionStyle = 'border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;font-size:11px;color:var(--ink-300);';
  const exception = showCustomer
    ? `<div style="${exceptionStyle}">Ngoại lệ: nếu sai khách/CIF/duplicate — <a href="#" onclick="hoChangeCust('${id}');return false;" style="color:var(--amber-600);">Yêu cầu điều chỉnh khách hàng</a> (revalidate + có thể re-rating).</div>`
    : `<div style="${exceptionStyle}">Kênh tích hợp ngân hàng: định danh khách chỉ hiển thị sau khi khách đồng ý (consent) trong phiên xử lý — không chọn/đổi khách tại đây.</div>`;
  hoModal(`<div class="modal2-head"><b>${showCustomer?'Khách hàng · chỉ review':'Ngữ cảnh bàn giao · chỉ review'}</b><span class="modal2-close" onclick="hoClose()">&times;</span></div><div class="modal2-body"><div style="font-size:12px;color:var(--ink-500);margin-bottom:8px;">Nhân viên tư vấn không chọn lại khách khi tiếp nhận — chỉ xem ngữ cảnh, nguồn, consent.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:12px;">${idRows}<div>Nguồn: ${h.sourceSystem||h.source}</div><div>Lead: ${h.leadRef||'—'}</div><div>Sản phẩm: ${h.productName||'—'}</div><div>Consent: ${h.consent==='VALID'?'<span class="badge badge-ready" style="font-size:9px;">Hợp lệ</span>':'<span class="badge badge-conditional" style="font-size:9px;">Chờ</span>'}</div></div>${exception}<div style="display:flex;justify-content:flex-end;margin-top:10px;"><button class="btn btn-secondary btn-sm" onclick="hoClose()">Đóng</button></div></div>`); };
window.hoChangeCust=(id)=>{ const opts=(BANCA.myCustomers?BANCA.myCustomers():[]).filter(c=>c.scope[me]!=='PROSPECT').slice(0,8); hoModal(`<div class="modal2-head"><b>Yêu cầu điều chỉnh khách hàng (ngoại lệ)</b><span class="modal2-close" onclick="hoClose()">&times;</span></div><div class="modal2-body"><div class="card" style="padding:8px 10px;background:#fff6e6;border-color:#ffe0a3;font-size:11px;color:#8a5a00;margin-bottom:10px;">Đổi khách sẽ revalidate consent/portfolio/eligibility/quote. Quote KH cũ KHÔNG giữ cho KH mới (re-rating). Nếu nhân viên tư vấn không còn hợp lệ → về hàng chờ phân công.</div><div class="label" style="margin-bottom:6px;">Khách hàng đúng</div><select id="ho-newcust" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;">${opts.map(c=>`<option value="${c.id}">${c.name} · CIF ${c.cif||'—'}</option>`).join('')}</select><div class="label" style="margin-bottom:6px;">Lý do (bắt buộc)</div><input id="ho-cust-reason" placeholder="Chọn sai / duplicate / sai CIF / integration lỗi" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;"><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;"><button class="btn btn-secondary btn-sm" onclick="hoClose()">Huỷ</button><button class="btn btn-primary btn-sm" onclick="hoDoChangeCust('${id}')">Xác nhận</button></div></div>`); };
window.hoDoChangeCust=(id)=>{ const cid=document.getElementById('ho-newcust').value; const reason=(document.getElementById('ho-cust-reason').value||'').trim(); if(!reason)return hoToast('Nhập lý do.'); const c=BANCA.customerById(cid)||{}; const res=BANCA.changeCustomer(id,cid,c.name,reason,me); hoClose(); hoToast(res&&res.invalidated?'Đã đổi khách — assignment vô hiệu, về hàng chờ. Quote cần re-rating.':'Đã đổi khách — quote cần re-rating.'); setTimeout(()=>location.reload(),900); };
window.hoAccept=(id)=>{ const h=BANCA.handoffById(id); BANCA.acceptHandoff(id, me); hoClose();
  hoToast(h.type==='SALES_HANDOFF'?'Đã tiếp nhận — mở phiên bán hàng.':h.type==='CASE_REASSIGNMENT'?'Đã tiếp nhận hồ sơ.':'Đã bắt đầu công việc hỗ trợ.');
  setTimeout(()=>{ if(h.type==='DELEGATION'){ location.href=r+'modules/application-workspace/index.html?id='+(h.caseId||''); }
    else if(h.type==='CASE_REASSIGNMENT'){ location.href=r+'modules/application-workspace/index.html?id='+(h.caseId||''); }
    else { location.href=r+'modules/application-workspace/index.html?entry=CONVERTED_FROM_ADVICE&adviceId='+(h.adviceId||'')+'&handoff='+id; } }, 700); };
window.hoDecline=(id)=>{ hoModal(`<div class="modal2-head"><b>Từ chối bàn giao</b><span class="modal2-close" onclick="hoClose()">&times;</span></div><div class="modal2-body"><div class="label" style="margin-bottom:6px;">Lý do (bắt buộc)</div><select id="ho-reason" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;">${(BANCA.DECLINE_REASONS||[]).map(x=>`<option>${x}</option>`).join('')}</select><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;"><button class="btn btn-secondary btn-sm" onclick="hoClose()">Huỷ</button><button class="btn btn-primary btn-sm" onclick="hoDoDecline('${id}')">Xác nhận từ chối</button></div></div>`); };
window.hoDoDecline=(id)=>{ const reason=document.getElementById('ho-reason').value; BANCA.declineHandoff(id, reason, me); hoClose(); hoToast('Đã từ chối — trả lại hàng chờ với lý do.'); setTimeout(()=>location.reload(),700); };
window.hoNeedInfo=(id)=>{ hoModal(`<div class="modal2-head"><b>Yêu cầu bổ sung thông tin</b><span class="modal2-close" onclick="hoClose()">&times;</span></div><div class="modal2-body"><div style="font-size:12px;color:var(--ink-500);margin-bottom:6px;">Gửi nội dung cần bổ sung cho người tư vấn/phân công — bàn giao chuyển "Cần bổ sung", chưa tiếp nhận.</div><textarea id="ho-info" placeholder="Cần bổ sung gì? (chứng từ, thông tin khách...)" style="width:100%;min-height:60px;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:13px;"></textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;"><button class="btn btn-secondary btn-sm" onclick="hoClose()">Huỷ</button><button class="btn btn-primary btn-sm" onclick="hoDoNeedInfo('${id}')">Gửi yêu cầu bổ sung</button></div></div>`); };
window.hoDoNeedInfo=(id)=>{ const note=(document.getElementById('ho-info').value||'').trim(); if(!note)return hoToast('Nhập nội dung cần bổ sung.'); BANCA.needMoreInfo(id,note,me); hoClose(); hoToast('Đã gửi yêu cầu bổ sung.'); setTimeout(()=>location.reload(),700); };

// ===== P0: "Việc cần làm ngay" — action queue gộp mọi việc có SLA/blocker theo 1 thứ tự =====
const NOW_TS = new Date('2026-07-22T16:47:00+07:00').getTime();
function relDue(due){
  if(!due) return {label:'Chưa có hạn', tone:'var(--ink-300)', order:9e15};
  const s=String(due).trim(); const t=new Date(s.replace(' ','T')+(s.length<=10?'T23:59:59':'')+'+07:00').getTime();
  if(isNaN(t)) return {label:s, tone:'var(--ink-500)', order:8e15};
  const diff=t-NOW_TS; const m=Math.round(Math.abs(diff)/60000);
  const human=mm=>{ if(mm<60)return mm+' phút'; const h=Math.round(mm/60); if(h<24)return h+' giờ'; return Math.round(h/24)+' ngày'; };
  if(diff<0) return {label:'Quá hạn '+human(m), tone:'var(--red-600)', order:diff, overdue:true};
  if(m<=180) return {label:'Còn '+human(m), tone:'var(--amber-600)', order:diff};
  return {label:'Còn '+human(m), tone:'var(--ink-500)', order:diff};
}
const SEVQ={HIGH:['Cao','#fdecec','var(--red-600)'],MED:['TB','#fff6e6','var(--amber-600)'],LOW:['Thấp','#eef4ff','var(--brand-600)']};
const WORK_QUEUE_CATEGORIES=[
  ['ALL','Tất cả'],['HANDOFF','Bàn giao'],['SUPPLEMENT','Cần bổ sung'],
  ['QUOTE','Tính phí lại'],['SUBMIT','Có thể nộp']
];
let workQueueFilter='ALL';
let workQueueExpanded=false;
let workQueueStatus='ready';
function collectActionItems(){
  const items=[];
  // 1) Bàn giao chờ tiếp nhận
  (BANCA.handoffsForSeller?BANCA.handoffsForSeller(me):[]).forEach(h=>{
    const primaryLabel=h.type==='SALES_HANDOFF'?'Tiếp nhận & bán hàng':h.type==='CASE_REASSIGNMENT'?'Tiếp nhận & xử lý':'Bắt đầu công việc';
    const context=[h.productName,h.packageName,h.needSummary,h.recommendationReason||h.taskNote].filter(Boolean).join(' · ');
    items.push({key:'HANDOFF:'+h.id,category:'HANDOFF',severity:h.priority==='HIGH'?'HIGH':'MED',
      kind:'Bàn giao chờ tiếp nhận',customer:(showCustomer?(h.customerName+(h.cif?' · CIF '+h.cif:'')):('🔒 '+anonHandoffRef(h))),
      description:context||BANCA.handoffTypeLabel(h.type),recordRef:h.caseId||h.leadRef||h.id,
      id:h.id,due:h.acceptBy,
      primaryActionHtml:`<button class="btn btn-primary btn-sm" onclick="hoAccept('${h.id}')">${primaryLabel}</button>`,
      secondaryActionHtml:`<button class="btn btn-secondary btn-sm" aria-haspopup="dialog" onclick="hoMore('${h.id}')">Khác</button>`});
  });
  // 2) Bản chào cần bổ sung (sau nộp)
  needMore.forEach(a=>{ items.push({key:'SUPPLEMENT:'+a.id,category:'SUPPLEMENT',severity:'HIGH',
    kind:'Bản chào cần bổ sung',customer:custCell(a),description:(a.supplement&&a.supplement.items?a.supplement.items.join('; '):''),
    recordRef:a.id,id:a.id,due:a.deadline,
    primaryActionHtml:`<a class="btn btn-primary btn-sm" href="${wsUrl(a.id)}&tab=supplement">Bổ sung</a>`}); });
  // 3) Báo giá sắp/đã hết hạn (nháp)
  drafts.filter(a=>{ if((a.warnings||[]).some(w=>['QUOTE_EXPIRING','QUOTE_NEED_RERATE'].includes(w)))return true; const st=a.quote?BANCA.quoteStatus(a.quote,null):null; return st==='EXPIRED'||st==='EXPIRING_SOON'; })
    .forEach(a=>{ items.push({key:'QUOTE:'+a.id,category:'QUOTE',severity:'MED',
      kind:'Báo giá sắp hết hạn',customer:custCell(a),description:a.quote?(a.quote.id+' v'+a.quote.version):'',
      recordRef:a.id,id:a.id,due:a.quote?a.quote.validUntil:null,
      primaryActionHtml:`<a class="btn btn-primary btn-sm" href="${wsUrl(a.id)}&step=PACKAGE_AND_QUOTE">Tính phí lại</a>`}); });
  // 4) Bản chào có thể nộp hôm nay (đã tới bước review, không có warning chặn)
  drafts.filter(a=>(a.currentStage==='REVIEW_AND_SUBMIT'||a.progress>=100) && !(a.warnings||[]).some(w=>['MISSING_INFORMATION','MISSING_DOCUMENT','QUOTE_NEED_RERATE','CANNOT_SUBMIT'].includes(w)))
    .forEach(a=>{ items.push({key:'SUBMIT:'+a.id,category:'SUBMIT',severity:'LOW',
      kind:'Bản chào có thể nộp',customer:custCell(a),description:a.productName||'',
      recordRef:a.id,id:a.id,due:null,
      primaryActionHtml:`<a class="btn btn-primary btn-sm" href="${wsUrl(a.id)}&step=REVIEW_AND_SUBMIT">Kiểm tra & nộp</a>`}); });
  const rank={HIGH:0,MED:1,LOW:2};
  const deduped=[...new Map(items.map(it=>[it.key,it])).values()];
  return deduped.map(it=>({...it,rt:relDue(it.due)})).sort((a,b)=>{
    const ao=a.rt.overdue?0:1,bo=b.rt.overdue?0:1;
    if(ao!==bo)return ao-bo;
    if(rank[a.severity]!==rank[b.severity])return rank[a.severity]-rank[b.severity];
    return a.rt.order-b.rt.order;
  });
}
function workQueueInnerHtml(){
  if(workQueueStatus==='loading') return `<div class="card"><div class="empty-state" role="status">Đang tải việc cần làm…</div></div>`;
  let items;
  try{ items=collectActionItems(); }
  catch(err){ workQueueStatus='error'; }
  if(workQueueStatus==='error') return `<div class="card"><div class="empty-state" role="alert">Chưa thể tải việc cần làm.<div style="margin-top:8px;"><button class="btn btn-secondary btn-sm" onclick="workQueueRetry()">Thử lại</button></div></div></div>`;
  const counts=WORK_QUEUE_CATEGORIES.reduce((acc,c)=>{acc[c[0]]=c[0]==='ALL'?items.length:items.filter(i=>i.category===c[0]).length;return acc;},{});
  const filters=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;" role="group" aria-label="Lọc việc cần làm">${WORK_QUEUE_CATEGORIES.map(c=>{
    const active=workQueueFilter===c[0];
    return `<button class="btn ${active?'btn-primary':'btn-secondary'} btn-sm" aria-pressed="${active}" onclick="workQueueSetFilter('${c[0]}')">${active?'Đang lọc: ':''}${c[1]} (${counts[c[0]]})</button>`;
  }).join('')}</div>`;
  const filtered=workQueueFilter==='ALL'?items:items.filter(i=>i.category===workQueueFilter);
  if(!items.length) return `${filters}<div class="card"><div class="empty-state">Không có việc cần làm. Bạn đã xử lý hết hàng chờ hôm nay.</div></div>`;
  if(!filtered.length) return `${filters}<div class="card"><div class="empty-state">Không có việc trong nhóm này.<div style="margin-top:8px;"><button class="btn btn-secondary btn-sm" onclick="workQueueSetFilter('ALL')">Xem tất cả việc</button></div></div></div>`;
  const visible=workQueueExpanded?filtered:filtered.slice(0,8);
  const rows=visible.map(it=>{ const s=SEVQ[it.severity]; const isApp=/^(APP|DRAFT)/.test(it.recordRef||'');
    return `<tr>
      <td><span class="badge" style="background:${s[1]};color:${s[2]};">${s[0]}</span></td>
      <td style="font-size:12px;color:${it.rt.tone};font-weight:600;">${it.rt.label}</td>
      <td style="font-size:12px;">${it.customer||'—'}</td>
      <td style="font-size:12px;"><b>${it.kind}</b>${it.description?`<div style="font-size:11px;color:var(--ink-300);">${it.description}</div>`:''}</td>
      <td>${isApp?`<a href="${wsUrl(it.recordRef)}" style="font-size:12px;color:var(--brand-600);font-weight:600;">${it.recordRef}</a>`:`<span style="font-size:12px;color:var(--ink-500);">${it.recordRef||'—'}</span>`}</td>
      <td class="table-action-cell"><div class="table-action-stack">${it.primaryActionHtml}${it.secondaryActionHtml||''}</div></td>
    </tr>`; }).join('');
  const toggle=filtered.length>8?`<div style="display:flex;justify-content:center;margin-top:8px;"><button class="btn btn-secondary btn-sm" aria-expanded="${workQueueExpanded}" onclick="workQueueToggleExpanded()">${workQueueExpanded?'Thu gọn':'Xem tất cả ('+filtered.length+')'}</button></div>`:'';
  return `${filters}<div class="card" style="padding:0;overflow-x:auto;"><table class="dtable"><thead><tr><th>Ưu tiên</th><th>Hạn / SLA</th><th>${custLabelHdr}</th><th>Việc tiếp theo</th><th>Hồ sơ</th><th class="table-action-cell">Hành động</th></tr></thead><tbody>${rows}</tbody></table></div>${toggle}`;
}
function actionQueueBlock(){
  return `<div class="section-title"><h2>Việc cần làm ngay</h2><span class="subtitle">Hàng chờ công việc duy nhất · xử lý từ trên xuống</span></div><div id="home-work-queue">${workQueueInnerHtml()}</div>`;
}
window.workQueueRender=()=>{ const el=document.getElementById('home-work-queue');if(el)el.innerHTML=workQueueInnerHtml(); };
window.workQueueSetFilter=category=>{ workQueueFilter=WORK_QUEUE_CATEGORIES.some(c=>c[0]===category)?category:'ALL';workQueueExpanded=false;workQueueRender(); };
window.workQueueToggleExpanded=()=>{ workQueueExpanded=!workQueueExpanded;workQueueRender(); };
window.workQueueRetry=()=>{ workQueueStatus='ready';workQueueRender(); };
window.hoMore=id=>{ const h=BANCA.handoffById(id);if(!h)return;
  const assignment=BANCA.participantName(h,'ASSIGNMENT_ACTOR')||'—';
  const progress=h.completeness!=null?` · Đã hoàn thành ${h.completeness}%`:'';
  const pending=h.state==='NEED_MORE_INFORMATION'?`<div class="alert2 warning" style="margin-bottom:var(--space-sm);">Đã yêu cầu bổ sung: ${h.infoRequest||'—'} — đang chờ phản hồi.</div>`:'';
  hoModal(`<div class="modal2-head"><b>Thao tác bàn giao</b><span class="modal2-close" onclick="hoClose()">&times;</span></div><div class="modal2-body"><div style="font-size:12px;color:var(--ink-700);margin-bottom:var(--space-sm);"><b>${h.productName||BANCA.handoffTypeLabel(h.type)}</b>${h.packageName?' · '+h.packageName:''}</div><div style="font-size:12px;color:var(--ink-500);margin-bottom:var(--space-sm);">${h.needSummary||h.recommendationReason||h.taskNote||'Không có ghi chú thêm.'}</div><div style="font-size:11px;color:var(--ink-500);margin-bottom:var(--space-sm);">Người phân công: <b>${assignment}</b>${progress} · Hạn tiếp nhận: <b>${h.acceptBy||'—'}</b></div>${pending}<div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-secondary btn-sm" onclick="hoReview('${id}')">${showCustomer?'Xem khách hàng':'Xem ngữ cảnh'}</button>${h.state!=='NEED_MORE_INFORMATION'?`<button class="btn btn-secondary btn-sm" onclick="hoNeedInfo('${id}')">Cần bổ sung</button>`:''}<button class="btn btn-secondary btn-sm" onclick="hoDecline('${id}')">Từ chối</button></div></div>`);
};

shell('Trang chủ','Hôm nay tôi cần làm gì?',
homeScopeTabs+`
<section class="home-head">
 <div class="home-head-id">
  <div class="h1" style="margin:0 0 2px;">Xin chào ${p.name}</div>
  <div class="subtitle">${p.role} · ${p.branch||p.partner||''}${p.team?' · '+p.team:''} · ${drafts.length} bản chào chưa nộp · ${needMore.length} cần bổ sung · ${submitted.length} đang xử lý</div>
 </div>
</section>

${actionQueueBlock()}

<div class="section-title"><h2>Bản chào chưa nộp gần đây</h2><a href="${r}modules/unsubmitted-applications/index.html" style="font-size:12px;color:var(--brand-600);">Xem tất cả (${drafts.length}) →</a></div>
${drafts.length?`<div class="card" style="padding:0;"><table class="dtable"><thead><tr><th>Mã bản chào</th><th>${custLabelHdr}</th><th>Sản phẩm</th><th>Bước hiện tại</th><th>Hoàn thành</th><th>Cảnh báo</th><th>Cập nhật</th><th class="table-action-cell">Hành động</th></tr></thead><tbody>${draftRows}</tbody></table></div>`:`<div class="card"><div class="empty-state">Chưa có bản chào nháp. Bấm "Tạo bản chào" để tạo bản chào đầu tiên.</div></div>`}

<div class="section-title"><h2>Trạng thái xử lý bản chào đã nộp</h2><span class="subtitle">Click để xem danh sách theo trạng thái</span></div>
${cardHtml}

<div class="section-title"><h2>Hiệu suất cá nhân</h2><span class="subtitle">Tháng này · sync ${BANCA.partnerConfig.syncAt}</span></div>
${kpiHtml}

<div class="layout-2col" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;align-items:stretch;">
 <div style="display:flex;flex-direction:column;min-height:0;">
  <div class="section-title"><h2>Hợp đồng</h2><a href="${r}modules/policies/index.html" style="font-size:12px;color:var(--brand-600);">Xem tất cả →</a></div>
  <div class="card" style="flex:1;max-height:340px;overflow-y:auto;">
   <div class="label">Mới phát hành</div>
   ${newPols.length? newPols.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);"><div><a href="${r}modules/policies/index.html?view=detail&id=${x.id}" style="font-weight:600;font-size:13px;color:var(--brand-600);">${x.id}</a><div style="font-size:11px;color:var(--ink-500);">${showCustomer?custName(x.customerId)+' · ':''}${x.vehicle?(x.vehicle.brand+' '+x.vehicle.model):(x.productName||x.package||'')}</div></div><span class="badge badge-ready">Mới</span></div>`).join(''):'<div style="font-size:12px;color:var(--ink-300);padding:6px 0;">Không có</div>'}
   <div class="label" style="margin-top:12px;">Sắp tái tục</div>
   ${renewals.length? renewals.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);"><div><a href="${r}modules/policies/index.html?view=detail&id=${x.id}" style="font-weight:600;font-size:13px;color:var(--brand-600);">${x.id}</a><div style="font-size:11px;color:var(--ink-500);">${showCustomer?custName(x.customerId)+' · ':''}hết hạn ${x.effectiveTo}</div></div><span class="badge badge-conditional">Tái tục</span></div>`).join(''):'<div style="font-size:12px;color:var(--ink-300);padding:6px 0;">Không có</div>'}
  </div>
 </div>
 <div style="display:flex;flex-direction:column;min-height:0;">
  <div class="section-title"><h2>Thông báo</h2></div>
  <div class="card" style="flex:1;max-height:340px;overflow-y:auto;">${notiHtml}</div>
 </div>
</div>


`);
}
</script></body></html>
