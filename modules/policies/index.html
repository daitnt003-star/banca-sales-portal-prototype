<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hợp đồng — Banca Sales Portal</title><script src="../../shared/js/head-loader.js?v=44"></script></head><body><script>
const p = BANCA.persona(), me = BANCA.current(), r = rel();
const qs = new URLSearchParams(location.search);
const view = qs.get('view') || 'list';
const fTab = qs.get('f') || 'ALL';
const TODAY = new Date().toISOString().slice(0,10);

if(p.status!=='ACTIVE'){
 shell('Hợp đồng','Không có quyền truy cập',`<div class="card"><div class="alert2 danger">Tài khoản ngừng hoạt động.</div></div>`,{startSale:false});
} else if(view==='detail'){
 // ===================== POLICY DETAIL (A-05: view qua query param) =====================
 const pol = BANCA.policyById(qs.get('id'));
 const canView = pol && (pol.owner===me
  || (BANCA.inManagerScope && BANCA.inManagerScope(BANCA.personas[pol.owner], me))
  || (p.managerScope==='TEAM' && (BANCA.personas[pol.owner]||{}).team===p.team)
  || (p.managerScope==='BRANCH' && (BANCA.personas[pol.owner]||{}).branch===p.branch));
 if(!pol){
  shell('Hợp đồng','Không tìm thấy',`<div class="card"><div class="empty-state">Hợp đồng không tồn tại. <a href="index.html">Về danh sách</a></div></div>`,{startSale:false});
 } else if(!canView){
 shell('Hợp đồng','ACCESS_DENIED',`<div class="card"><div class="alert2 danger"><b>ACCESS_DENIED</b> — persona ${me} không có quyền xem hợp đồng ${pol.id} (owner ${pol.owner}).</div></div>`,{startSale:false});
 } else {
  const isHealthPolicy = pol.productType==='health' || pol.productId==='health' || /Bảo hiểm sức khỏe/i.test(pol.productName||'');
  const isPaPolicy = pol.productType==='pa' || pol.productId==='pa' || /Bảo hiểm tai nạn cá nhân/i.test(pol.productName||'');
  const docAuditKey = 'policyDocAudit:'+pol.id;
  const docSendKey = 'policyDocSend:'+pol.id;
  const docEsc = v => String(v==null?'—':v).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const docToday = TODAY.replace(/-/g,'');
  const docActor = (BANCA.personas[me]||{}).name || me;
  function docLoadJson(key, fallback){
   try { return JSON.parse(localStorage.getItem(key)||'') || fallback; } catch(e){ return fallback; }
  }
  function docSaveJson(key, value){ localStorage.setItem(key, JSON.stringify(value)); }
  function policyDocEvents(){ return docLoadJson(docAuditKey, []); }
  function policyLastSend(){ return docLoadJson(docSendKey, null); }
  // §11 Dòng thời gian — nguồn sự kiện DÙNG CHUNG cho mọi sản phẩm:
  // audit hợp đồng + sự kiện gửi tài liệu + yêu cầu dịch vụ + khai báo tổn thất.
  function policyTimelineEvents(p){
   const evts = [];
   (p.audit||[]).forEach(a=>evts.push({at:a.at, by:a.by, text:a.action}));
   policyDocEvents().forEach(ev=>evts.push({at:ev.at, by:ev.by, text:ev.timelineText||ev.action}));
   BANCA.serviceRequestsOf(p.id).forEach(s=>evts.push({at:s.createdAt, by:(BANCA.personas[s.createdBy]||{}).name||s.createdBy, text:'Yêu cầu dịch vụ '+s.id+' — '+((BANCA.SERVICE_REQUEST_TYPES.find(t=>t.id===s.type)||{}).label||s.type)}));
   BANCA.claimsOf(p.id).forEach(c=>evts.push({at:c.notifiedAt, by:(BANCA.personas[c.notifiedBy]||{}).name||c.notifiedBy, text:'Khai báo tổn thất '+c.id}));
   return evts.sort((a,b)=>String(a.at||'').localeCompare(String(b.at||'')));
  }
  function policyDocsOf(srcApp, cust){
   const base = (pol.documents||[]).length ? pol.documents : [
    {id:'certificate-current', name:'Giấy chứng nhận bảo hiểm', fileName:(pol.certificate||pol.certificateNumber||'CERT')+'.pdf', kind:'PDF', version:'Hiện hành', issuedAt:pol.issueDate||pol.effectiveFrom, effectiveFrom:pol.effectiveFrom, source:'Core policy', status:'Hiện hành', canView:true, canDownload:true, canSendToCustomer:true},
    {id:'wording-current', name:'Điều khoản bảo hiểm', fileName:pol.wordingRef||'QT-BH-2026', kind:'PDF', version:'Hiện hành', issuedAt:pol.issueDate||pol.effectiveFrom, effectiveFrom:pol.effectiveFrom, source:'Sản phẩm', status:'Hiện hành', canView:true, canDownload:true, canSendToCustomer:true},
    {id:'source-application', name:'Yêu cầu bảo hiểm đã phát hành hợp đồng này', fileName:pol.appId||'—', kind:'Trang', version:'Bản phát hành', issuedAt:pol.issueDate||pol.effectiveFrom, effectiveFrom:pol.effectiveFrom, source:'Sales Portal', status:'Đã phát hành', canView:true, canDownload:true, canSendToCustomer:true},
    {id:'vat-invoice', name:'Hóa đơn VAT', fileName:pol.vatInvoice||'Chưa phát hành', kind:'PDF', version:'Hiện hành', issuedAt:pol.issueDate||pol.effectiveFrom, source:'Kế toán', status:pol.vatInvoice?'Sẵn sàng':'Chưa phát hành', canView:true, canDownload:!!pol.vatInvoice, canSendToCustomer:!!pol.vatInvoice},
    {id:'uw-letter', name:'Thư kết quả thẩm định', fileName:(srcApp&&srcApp.uw&&srcApp.uw.letter)||'UW-'+pol.id+'.pdf', kind:'PDF', version:'Nội bộ', issuedAt:pol.issueDate||pol.effectiveFrom, source:'Thẩm định', status:'Hạn chế', canView:true, canDownload:true, canSendToCustomer:false, restrictedReason:'Thư thẩm định không được phép gửi cho khách hàng.'}
   ];
   return base.filter(d=>d.canView!==false && !d.hiddenFromDocumentList).map(d=>Object.assign({}, d, {
    recipientName:(cust&&cust.name)||'',
    recipientPhone:(cust&&cust.phone)||'',
    recipientEmail:(cust&&cust.email)||''
   }));
  }
  function renderDocActionBar(canClaim, canRenew){
   const moreItems=[
    ['Yêu cầu sửa đổi (endorsement)','Đổi nội dung trên cùng số hợp đồng'],
    ...(pol.status==='ACTIVE'?[['Yêu cầu hủy','Chấm dứt hợp đồng trước hạn']]:[]),
    ['Xuất / Xem hóa đơn VAT',''],
    ['Ghi chú nội bộ','']
   ];
   return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:relative;">
    <button class="btn btn-primary btn-sm" type="button" onclick="policyOpenDocuments()">Tài liệu & gửi khách</button>
    ${canClaim?`<button class="btn btn-secondary btn-sm" type="button" onclick="policyDemoToast('Đã mở luồng khai báo tổn thất demo.')">Khai báo tổn thất</button>`:''}
    ${canRenew?`<button class="btn btn-secondary btn-sm" type="button" onclick="policyDemoToast('Đã mở luồng tái tục demo.')">Tạo tái tục</button>`:''}
    <button class="btn btn-secondary btn-sm" type="button" onclick="const m=document.getElementById('policy-more-actions');m.style.display=m.style.display==='none'?'block':'none'">Khác ▾</button>
    <div id="policy-more-actions" style="display:none;position:absolute;right:0;top:38px;min-width:260px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(10,25,60,.18);z-index:90;padding:8px;">
     ${moreItems.map(([a,desc])=>`<div onclick="policyDemoToast('${docEsc(a)} đang ở chế độ demo.')" style="padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--ink-700);" onmouseover="this.style.background='var(--wash)'" onmouseout="this.style.background='transparent'">${a}${desc?`<div style="font-size:11px;color:var(--ink-300);">${desc}</div>`:''}</div>`).join('')}
    </div>
   </div>`;
  }
  function renderDocumentCenter(docs){
   const lastSend = policyLastSend();
   const current = docs.filter(d=>d.isPrevious!==true);
   const previous = docs.filter(d=>d.isPrevious===true);
   const rowHtml = d => {
    const disabled = d.canDownload===false ? 'disabled' : '';
    const title = d.canDownload===false ? (d.restrictedReason||'Bạn không có quyền tải tài liệu này.') : '';
    const warn = d.expired ? '<div style="font-size:11px;color:var(--amber-600);margin-top:2px;">Tài liệu đã hết hiệu lực.</div>' : '';
    const sendFlag = d.canSendToCustomer===false ? '<span class="badge badge-conditional">Không gửi khách</span>' : '<span class="badge badge-ready">Có thể gửi</span>';
    return `<div class="policy-doc-row" data-doc-id="${docEsc(d.id)}">
     <label class="policy-doc-check" title="${docEsc(title)}"><input type="checkbox" data-policy-doc="${docEsc(d.id)}" ${disabled}></label>
     <div class="policy-doc-main"><b>${docEsc(d.name)}</b><div class="code">${docEsc(d.fileName)}</div>${warn}</div>
     <div>${docEsc(d.kind||'Tài liệu')}</div>
     <div>${docEsc(d.version||'Hiện hành')}</div>
     <div>${docEsc(d.issuedAt||'—')}</div>
     <div>${docEsc(d.effectiveFrom||'—')}</div>
     <div>${docEsc(d.source||'—')}</div>
     <div><span class="badge ${d.expired?'badge-conditional':'badge-ready'}">${docEsc(d.status||'Sẵn sàng')}</span><div style="margin-top:4px;">${sendFlag}</div></div>
     <div><button class="btn btn-secondary btn-sm" type="button" onclick="policyPreviewDoc('${docEsc(d.id)}')">Xem trước</button></div>
    </div>`;
   };
   const selectedHtml = lastSend ? `<div id="policy-last-send" class="alert2 success" style="margin-top:12px;"><b>Gửi gần nhất:</b> ${docEsc(lastSend.at)} · ${docEsc(lastSend.channelLabel)} · ${docEsc(lastSend.recipientName)} · ${docEsc(lastSend.status)} · ${docEsc(lastSend.by)}</div>` : `<div id="policy-last-send" class="alert2" style="display:none;margin-top:12px;"></div>`;
   return `<section id="related-documents" class="pc-card policy-doc-card" style="scroll-margin-top:90px;">
    <h2>Tài liệu liên quan</h2>
    <div class="policy-doc-toolbar">
     <label class="policy-doc-select-all"><input type="checkbox" id="policy-doc-select-all"> Chọn tất cả</label>
     <span id="policy-doc-selected-count">Đã chọn: 0 tài liệu</span>
     <button class="btn btn-secondary btn-sm" type="button" id="policy-doc-download" disabled>Tải xuống</button>
     <button class="btn btn-primary btn-sm" type="button" id="policy-doc-send" disabled>Gửi cho khách</button>
     <button class="btn btn-secondary btn-sm" type="button" id="policy-doc-clear" disabled>Bỏ chọn</button>
     <span id="policy-doc-status" style="font-size:12px;color:var(--ink-500);"></span>
    </div>
    <div class="policy-doc-head"><span></span><span>Tên tài liệu</span><span>Loại</span><span>Phiên bản</span><span>Ngày phát hành</span><span>Ngày hiệu lực</span><span>Nguồn</span><span>Trạng thái</span><span></span></div>
    <div id="policy-doc-list">${current.map(rowHtml).join('')}</div>
    ${previous.length?`<details class="policy-doc-previous"><summary>Phiên bản trước</summary>${previous.map(rowHtml).join('')}</details>`:''}
    ${selectedHtml}
    <div id="policy-doc-errors" style="display:none;margin-top:10px;" class="alert2 danger"></div>
    <div id="policy-doc-mobile-bar" class="policy-doc-mobile-bar"><span id="policy-doc-mobile-count">Đã chọn 0</span><button class="btn btn-secondary btn-sm" type="button" id="policy-doc-mobile-download" disabled>Tải xuống</button><button class="btn btn-primary btn-sm" type="button" id="policy-doc-mobile-send" disabled>Gửi</button></div>
   </section>`;
  }
  function renderDocStyles(){
   return `<style>
    .policy-doc-card.policy-doc-focus{box-shadow:0 0 0 3px rgba(13,110,253,.16),0 1px 3px rgba(10,25,60,.04);}
    .policy-doc-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);}
    .policy-doc-select-all,.policy-doc-check{display:flex;align-items:center;gap:6px;}
    .policy-doc-head,.policy-doc-row{display:grid;grid-template-columns:34px minmax(190px,1.4fr) 86px 96px 118px 118px 110px 116px 96px;gap:10px;align-items:center;}
    .policy-doc-head{font-size:11px;color:var(--ink-300);letter-spacing:.04em;text-transform:uppercase;padding:8px 0;border-bottom:1px solid var(--line);}
    .policy-doc-row{font-size:12px;color:var(--ink-600);padding:12px 0;border-bottom:1px dashed var(--line);}
    .policy-doc-main b{font-size:13px;color:var(--ink-900);}
    .policy-doc-main .code{font-size:11px;color:var(--ink-300);margin-top:2px;word-break:break-word;}
    .policy-doc-previous{margin-top:10px;font-size:12px;color:var(--brand-600);}
    .policy-doc-mobile-bar{display:none;}
    .policy-toast{position:fixed;right:18px;bottom:18px;z-index:120;background:var(--ink-900);color:#fff;border-radius:8px;padding:10px 14px;font-size:12px;box-shadow:0 8px 28px rgba(10,25,60,.24);}
    .policy-modal-field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
    .policy-modal-field label{font-size:12px;color:var(--ink-600);font-weight:700;}
    .policy-modal-field input,.policy-modal-field select,.policy-modal-field textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;}
    @media(max-width:900px){
     .policy-doc-head{display:none;}
     .policy-doc-row{grid-template-columns:34px 1fr;gap:8px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;}
     .policy-doc-row>div:not(.policy-doc-main):not(.policy-doc-check){grid-column:2;font-size:11px;}
     .policy-doc-toolbar button{display:none;}
     .policy-doc-mobile-bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:110;gap:8px;align-items:center;justify-content:flex-end;background:#fff;border-top:1px solid var(--line);padding:10px 12px;box-shadow:0 -6px 20px rgba(10,25,60,.12);}
     .policy-doc-mobile-bar span{margin-right:auto;font-size:12px;font-weight:700;}
     .modal2{width:100%;max-width:none!important;min-height:100vh;border-radius:0;}
    }
   </style>`;
  }
  function renderDocScript(docs, cust){
   return `<script>
   (function(){
    const policyDocs = ${JSON.stringify(docs)};
    const policyId = ${JSON.stringify(pol.id)};
    const auditKey = ${JSON.stringify(docAuditKey)};
    const sendKey = ${JSON.stringify(docSendKey)};
    const actor = ${JSON.stringify(docActor)};
    const recipientDefault = ${JSON.stringify({name:(cust&&cust.name)||'', phone:(cust&&cust.phone)||'', email:(cust&&cust.email)||''})};
    function esc(v){ return String(v==null?'—':v).replace(/[&<>"']/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]; }); }
    function loadJson(key, fallback){ try { return JSON.parse(localStorage.getItem(key)||'') || fallback; } catch(e){ return fallback; } }
    function saveJson(key, value){ localStorage.setItem(key, JSON.stringify(value)); }
    function selectedDocs(){ return Array.from(document.querySelectorAll('[data-policy-doc]:checked')).map(function(x){ return policyDocs.find(function(d){ return d.id===x.getAttribute('data-policy-doc'); }); }).filter(Boolean); }
    function setStatus(text, tone){ const el=document.getElementById('policy-doc-status'); if(el){ el.textContent=text||''; el.style.color=tone||'var(--ink-500)'; } }
    function writeAudit(action, docs, extra){
     const list = loadJson(auditKey, []);
     const now = new Date();
     const at = now.toLocaleString('vi-VN', {hour12:false});
     list.unshift(Object.assign({at:at, by:actor, action:action, policyId:policyId, documentIds:docs.map(function(d){return d.id;}), documentNames:docs.map(function(d){return d.name;}), session:sessionStorage.getItem('BANCA_SESSION_ID')||'local-demo'}, extra||{}));
     saveJson(auditKey, list.slice(0,20));
     appendTimeline(list[0]);
     return list[0];
    }
    function appendTimeline(ev){
     const root=document.getElementById('policy-doc-timeline');
     if(!root) return;
     const div=document.createElement('div');
     div.style.cssText='display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;margin-bottom:12px;';
     div.innerHTML='<div style="width:16px;height:16px;border-radius:50%;background:var(--teal-600);color:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-top:0px;">✓</div><div><div style="font-size:13px;font-weight:700;color:var(--ink-800);line-height:1.25;">'+esc(ev.timelineText||ev.action)+'</div><div style="font-size:12px;color:var(--ink-500);margin-top:2px;">'+esc(ev.at)+' · '+esc(ev.by)+'</div></div>';
     root.prepend(div);
    }
    function updateSelection(){
     const count = selectedDocs().length;
     const has = count>0;
     ['policy-doc-download','policy-doc-send','policy-doc-clear','policy-doc-mobile-download','policy-doc-mobile-send'].forEach(function(id){ const el=document.getElementById(id); if(el) el.disabled=!has; });
     const label='Đã chọn: '+count+' tài liệu';
     const countEl=document.getElementById('policy-doc-selected-count'); if(countEl) countEl.textContent=label;
     const mobile=document.getElementById('policy-doc-mobile-count'); if(mobile) mobile.textContent='Đã chọn '+count;
     const all=document.getElementById('policy-doc-select-all');
     if(all){ const enabled=Array.from(document.querySelectorAll('[data-policy-doc]:not(:disabled)')); all.checked=enabled.length>0 && enabled.every(function(x){return x.checked;}); }
    }
    function blobDownload(name, text, type){
     const blob=new Blob([text], {type:type||'application/octet-stream'});
     const a=document.createElement('a');
     a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
     setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
    }
    window.policyDemoToast=function(text){
     const old=document.querySelector('.policy-toast'); if(old) old.remove();
     const el=document.createElement('div'); el.className='policy-toast'; el.textContent=text; document.body.appendChild(el);
     setTimeout(function(){ el.remove(); }, 2600);
    };
    window.policyOpenDocuments=function(){
     const url=new URL(location.href); url.searchParams.set('tab','documents'); history.replaceState(null,'',url.pathname+url.search+url.hash);
     const sec=document.getElementById('related-documents'); if(sec){ sec.scrollIntoView({behavior:'smooth', block:'start'}); sec.classList.add('policy-doc-focus'); setTimeout(function(){sec.classList.remove('policy-doc-focus');}, 1600); }
     const first=document.querySelector('[data-policy-doc]:not(:disabled)'); if(first) first.focus();
    };
    window.policyPreviewDoc=function(id){
     const d=policyDocs.find(function(x){return x.id===id;}); if(!d) return;
     policyDemoToast('Đang mở xem trước: '+d.name+'.');
    };
    window.policyDownloadDocs=function(){
     const docs=selectedDocs();
     if(!docs.length){ setStatus('Chọn ít nhất 1 tài liệu.', 'var(--amber-600)'); return; }
     setStatus('Đang chuẩn bị...', 'var(--brand-600)');
     const ok=docs.filter(function(d){ return d.canDownload!==false && d.fileName && d.fileName!=='Chưa phát hành'; });
     const bad=docs.filter(function(d){ return !ok.includes(d); });
     if(ok.length===1) blobDownload(ok[0].fileName, 'Demo file for '+policyId+' / '+ok[0].id, 'application/pdf');
     if(ok.length>1) blobDownload('POL-'+policyId+'-documents-${docToday}.zip', ok.map(function(d){return d.fileName;}).join('\\n'), 'application/zip');
     if(ok.length){
      writeAudit('Tải '+ok.length+' tài liệu', ok, {timelineText:actor+' tải '+ok.length+' tài liệu: '+ok.map(function(d){return d.name;}).join(', ')});
      setStatus(bad.length?'Không thể tải một số.':'Thành công', bad.length?'var(--amber-600)':'var(--teal-600)');
     } else setStatus('Không thể tải tài liệu đã chọn.', 'var(--red-600)');
     const err=document.getElementById('policy-doc-errors');
     if(err){ err.style.display=bad.length?'block':'none'; err.innerHTML=bad.length?'<b>Không thể tải:</b> '+bad.map(function(d){return esc(d.name);}).join(', '):''; }
    };
    function openSendModal(){
     const docs=selectedDocs();
     if(!docs.length){ setStatus('Chọn ít nhất 1 tài liệu.', 'var(--amber-600)'); return; }
     const blocked=docs.filter(function(d){ return d.canSendToCustomer===false; });

 const keepP=(k,v)=>{const o=new URLSearchParams(location.search); if(v==null||v==='ALL'||v==='')o.delete(k);else o.set(k,v); return '?'+o.toString();};
 const quickFilters=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">${tabs.map(([id,l])=>{const n=id==='ACTION'?all.filter(needsAction).length:all.filter(x=>matchTab(x,id)).length; const danger=(id==='ACTION'||id==='NEAR_EXPIRY')&&n>0&&fTab!==id; return `<a href="${keepP('f',id==='ALL'?null:id)}" class="chip" style="cursor:pointer;text-decoration:none;padding:6px 14px;font-size:12px;font-weight:600;${fTab===id?'background:var(--brand-600);color:#fff;':danger?'background:#fff6e6;color:var(--amber-600);border:1px solid #ffe0a3;':'background:var(--paper-card);color:var(--ink-500);border:1px solid var(--line);'}">${l} (${n})</a>`;}).join('')}</div>`;
 // ---- Search + drawer (người tham gia / sản phẩm / trạng thái vào drawer) ----
 const products=[...new Set(all.map(x=>x.productName))];
 const statuses=[...new Set(all.map(x=>x.status))];
 const stLabel=st=>({ACTIVE:'Đang hiệu lực',EXPIRED:'Hết hiệu lực',CANCELLED:'Đã hủy'}[st]||st);
 const fd=filterDrawer([
   {name:'part',label:'Người tham gia',type:'select',value:fPart,options:[['ALL','Mọi người tham gia'],...Object.keys(BANCA.personas||{}).map(pid=>[pid,(BANCA.personas[pid]||{}).name||pid])]},
   {name:'prod',label:'Sản phẩm',type:'select',value:fProd,options:[['ALL','Mọi sản phẩm'],...products.map(p2=>[p2,p2])]},
   {name:'st',label:'Trạng thái',type:'select',value:fSt,options:[['ALL','Mọi trạng thái'],...statuses.map(st=>[st,stLabel(st)])]}
 ], {f:fTab!=='ALL'?fTab:'', scope:fScope!=='SELF'?fScope:'', q:qs.get('q')||''});
 const searchRow=`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;">
   ${BANCA.ui.searchBar({mode:'submit',name:'q',value:qs.get('q')||'',placeholder:'Tìm khách hàng / số HĐ / số GCN / biển số',hidden:{f:fTab!=='ALL'?fTab:'',scope:fScope!=='SELF'?fScope:''}})}
   ${fd.button}
 </div>`;
 const filterBar=searchRow+quickFilters+fd.tags+fd.drawer;
 // ---- Bảng gộp cột: Khách/HĐ | Nhân viên phụ trách | Sản phẩm | Hiệu lực | Phí | Trạng thái | Hành động ----
 const bankBadge = `<span class="chip" style="background:var(--brand-100);color:var(--brand-700);font-size:11px;">Janus Bank</span>`;
 const rows=pols.map(x=>{
  const c=BANCA.customerById(x.customerId)||{};
  const dLeft=daysTo(x);
  const effTone = x.status!=='ACTIVE'?'var(--ink-300)':dLeft<=45?'var(--amber-600)':'var(--ink-500)';
  const effNote = x.status!=='ACTIVE'?stLabel(x.status):dLeft<=0?'Đã hết hạn':dLeft<=45?('Còn '+dLeft+' ngày'):('Còn '+dLeft+' ngày');
  return `<tr style="cursor:pointer;" data-policy-id="${x.id}">
  <td>${BANCA.customerCell(c)}<div style="font-size:11px;color:var(--ink-300);margin-top:2px;"><a href="?view=detail&id=${x.id}" data-policy-link="${x.id}" style="font-weight:600;color:var(--brand-600);text-decoration:none;">${x.id}</a> · GCN ${x.certificate} ${bankBadge}</div>${isMgr&&x.owner!==me?`<div style="font-size:11px;color:var(--ink-300);">${(BANCA.personas[x.owner]||{}).name||x.owner}</div>`:''}</td>
  <td style="font-size:12px;">${(()=>{const d=BANCA.policyDistributionOf?BANCA.policyDistributionOf(x.id,x.owner):{}; return BANCA.sellerCell(d._fallback?null:d.referrer, d._fallback?null:d.advisor, d.sellingProducer||x.owner);})()}</td>
  <td style="font-size:12px;">${x.productName} · ${((BANCA.paPackages||{})[x.package]||(BANCA.healthPackages||{})[x.package]||{}).name||x.package}${(x.vehicle&&x.vehicle.plate)?`<div style="font-size:11px;color:var(--ink-300);">${x.vehicle.brand||''} ${x.vehicle.model||''} · ${x.vehicle.plate}</div>`:''}</td>
  <td style="font-size:11px;">${x.effectiveFrom} → ${x.effectiveTo}<div style="font-size:11px;color:${effTone};font-weight:600;">${effNote}</div></td>
  <td style="font-size:12px;">${BANCA.vnd(x.premium)}</td>
  <td>${BANCA.policyBadge(x.status)}${x.renewalStatus==='RENEWAL_DUE'?' <span class="badge badge-conditional">Sắp tái tục</span>':''}${x.isNew?' <span class="badge badge-ready">Mới</span>':''}</td>
  <td style="white-space:nowrap;" data-no-row-nav="1">${policyActions(x)}</td>
 </tr>`;}).join('');
 // Action chuẩn hóa theo trạng thái: mỗi dòng 1 action CHÍNH + Chi tiết phụ.
 function policyActions(x){
   const detail=`<a class="btn btn-secondary btn-sm" href="?view=detail&id=${x.id}">Chi tiết</a>`;
   if(x.renewalStatus==='RENEWAL_DUE'){
     const renew = x.renewalDraftId?`<a class="btn btn-primary btn-sm" href="${r}modules/application-workspace/index.html?id=${x.renewalDraftId}">Tái tục</a>`:`<button class="btn btn-primary btn-sm" onclick="alert('Tạo yêu cầu tái tục (demo)')">Tái tục</button>`;
     return renew+' '+detail;
   }
   if(x.isNew) return `<button class="btn btn-primary btn-sm" onclick="alert('Gửi GCN cho khách (demo)')">Gửi GCN</button> `+detail;
   if(x.status!=='ACTIVE') return detail+` <button class="btn btn-secondary btn-sm" onclick="alert('Lý do hủy: ${(x.cancelReason||'Khách yêu cầu chấm dứt trước hạn').replace(/'/g,'')} (demo)')">Xem lý do hủy</button>`;
   // Đang hiệu lực
   return detail+` <button class="btn btn-secondary btn-sm" onclick="alert('Tạo yêu cầu bồi thường (demo)')">Tạo bồi thường</button>`;
 }
 const scopeLabelOf=s=>({SELF:'Của tôi',TEAM:'Đội nhóm',BRANCH:'Chi nhánh',REGION:'Khu vực'}[s]||s);
 // Dùng chung DataScopeSelector (đồng bộ với danh sách Bản chào) — không tự dựng scope tab riêng.
 const scopeBar = `<div style="margin-bottom:12px;">${BANCA.ui.dataScopeSelector(me, fScope, qs.get('unit'), r)}</div>`;
 shell('Hợp đồng','Hợp đồng',
 scopeBar+`
 ${BANCA.uxListHeader('Danh sách hợp đồng','Theo dõi hợp đồng đã phát hành, tái tục và hiệu lực',`Hiển thị <b>${pols.length}</b> / ${all.length} hợp đồng · phạm vi <b>${scopeLabelOf(fScope)}</b>`,filterBar)}
 ${pols.length?`<div class="card" style="padding:0;"><table class="dtable"><thead><tr><th>Khách hàng / Hợp đồng</th><th>Nhân viên phụ trách</th><th>Sản phẩm</th><th>Hiệu lực</th><th>Phí</th><th>Trạng thái</th><th>Hành động</th></tr></thead><tbody>${rows}</tbody></table></div>`
  :`<div class="card"><div class="empty-state">Không có hợp đồng khớp bộ lọc. <a href="?">Xóa bộ lọc</a></div></div>`}
 `);
 setTimeout(function(){
  document.addEventListener('click', function(ev){
   if(ev.target.closest('[data-no-row-nav]')) return;
   const direct = ev.target.closest('[data-policy-link]');
   const row = ev.target.closest('tr[data-policy-id]');
   const id = direct ? direct.getAttribute('data-policy-link') : (row && row.getAttribute('data-policy-id'));
   if(id){ ev.preventDefault(); location.href='?view=detail&id='+encodeURIComponent(id); }
  });
 },0);
}
</script></body></html>
