<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bản chào — Banca Sales Portal</title><script src="../../shared/js/head-loader.js?v=46"></script></head><body><script>
// Thin wrapper cho lifecycle PREPARING (đang chuẩn bị) — dùng chung QuoteListShell + QuoteDataTable.
const p = BANCA.persona(), me = BANCA.current(), r = rel();
const qs = new URLSearchParams(location.search);
if(p.status!=='ACTIVE'){
 shell('Bản chào','Bản chào',`<div class="card"><div class="alert2 danger">Tài khoản ngừng hoạt động — không thể xem bản chào.</div></div>`,{startSale:false});
} else {
 const SCOPES = (BANCA.availableScopes?BANCA.availableScopes(me):['SELF']);
 const fScope = SCOPES.includes(qs.get('scope'))?qs.get('scope'):'SELF';
 const fUnit = qs.get('unit')||null;
 const fStage = qs.get('stage')||'ALL';
 const fWarn = qs.get('warn')==='1';
 const fSearch = (qs.get('q')||'').toLowerCase();
 const fProd = qs.get('prod')||'ALL', fFrom = qs.get('from')||'', fTo = qs.get('to')||'';
 const canSell = (BANCA.resolveManagerProfile?BANCA.resolveManagerProfile(me).sellingEnabled!==false:true);

 let all = (fScope==='SELF')
   ? BANCA.myApps('NOT_SUBMITTED').filter(a=>a.owner===me)
   : (BANCA.appsForScope?BANCA.appsForScope(fScope,me):BANCA.myApps('NOT_SUBMITTED')).filter(a=>a.submissionState==='NOT_SUBMITTED');
 all = BANCA.applyUnitFilter(all, fUnit);
 const total = all.length;
 let apps = all.slice();
 if(fStage!=='ALL') apps = apps.filter(a=>a.currentStage===fStage);
 if(fWarn) apps = apps.filter(a=>(a.warnings||[]).length);
 if(fProd!=='ALL') apps = apps.filter(a=>a.productId===fProd);
 if(fFrom) apps = apps.filter(a=>(a.updatedAt||'').slice(0,10)>=fFrom);
 if(fTo) apps = apps.filter(a=>(a.updatedAt||'').slice(0,10)<=fTo);
 if(fSearch) apps = apps.filter(a=>{ const c=BANCA.customerById(a.customerId)||{}; return (c.name||'').toLowerCase().includes(fSearch)||(c.phone||'').includes(fSearch)||a.id.toLowerCase().includes(fSearch); });
 apps.sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));

 const counts = BANCA.quoteLifecycleCounts(me, fScope, fUnit);
 // PREPARING quick filters: journey stage + warning (KHÔNG có "Cần tôi xử lý").
 const stageCounts={}; all.forEach(a=>{stageCounts[a.currentStage]=(stageCounts[a.currentStage]||0)+1;});
 const stageHref=(v)=>{const o=new URLSearchParams(location.search); if(v==='ALL')o.delete('stage');else o.set('stage',v); return '?'+o.toString();};
 const warnHref=()=>{const o=new URLSearchParams(location.search); if(fWarn)o.delete('warn');else o.set('warn','1'); return '?'+o.toString();};
 const chip=(href,label,on,n)=>`<a href="${href}" class="oqf-chip${on?' on':''}">${label}${n!=null?` (${n})`:''}</a>`;
 const quick = `<div class="offer-quick-filters">
   <div class="oqf-row"><span class="oqf-label">Bước hành trình:</span>
     ${chip(stageHref('ALL'),'Tất cả',fStage==='ALL')}
     ${BANCA.PREP_STAGE_ORDER.map(s=>chip(stageHref(s),BANCA.PREP_STAGE_LABELS[s],fStage===s,stageCounts[s]||0)).join('')}
   </div>
   <div class="oqf-row"><span class="oqf-label">Cảnh báo:</span>${chip(warnHref(),'Chỉ có cảnh báo',fWarn)}</div>
 </div>`;

 const drawerFields=[
  {name:'prod', label:'Sản phẩm', type:'select', value:fProd, options:[['ALL','Mọi sản phẩm'],...[...new Set(all.map(a=>a.productId))].map(x=>[x,(BANCA.products.find(pp=>pp.id===x)||{}).name||x])]},
  {name:'from', label:'Cập nhật từ ngày', type:'date', value:fFrom},
  {name:'to', label:'Cập nhật đến ngày', type:'date', value:fTo}
 ];
 const fd = filterDrawer(drawerFields, {stage:fStage, warn:fWarn?'1':'', q:qs.get('q')||''});

 const pageHeader = BANCA.ui.pageHeader({
   title:'Bản chào',
   description:'Theo dõi Bản chào theo vòng đời và tiếp tục đúng việc cần xử lý.',
   metaHtml:`Hiển thị <b>${apps.length}</b> / ${total} bản chào`
 });
 const body = BANCA.ui.quoteListShell({
   me, r, lifecycle:'PREPARING', g5:null, counts, scope:fScope, unit:fUnit, q:qs.get('q')||'',
   apps, shown:apps.length, total, canSell,
   pageHeaderHtml:pageHeader,
   quickFiltersHtml: quick,
   advancedBtn: fd.button, advancedTags: fd.tags, advancedDrawer: fd.drawer
 });
 shell('Bản chào','Bản chào', body, {startSale:false,headerActionMode:'OFFERS'});
}
</script></body></html>
